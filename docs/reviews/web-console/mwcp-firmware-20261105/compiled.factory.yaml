# Generated local compile input. Not a release and not the file CI publishes.
packages:
  # Include all of the core configuration
  core: !include ../../tests/r60abd1-esp32c3.yaml

esphome:
  # This will allow for project identification,
  # configuration and updates.
  project:
    name: mmwave.r60abd1
    version: "v0.0.0-local.20261105" # This will be replaced by the github workflows with the `release` version

# This should point to the public location of the yaml file that will be adopted.
# In this case it is the core yaml file that does not contain the extra things
# that are provided by this factory yaml file as the user does not need these once adopted.
dashboard_import:
  package_import_url: github://zomco/mmwave-component/tests/r60abd1-esp32c3.yaml@main
  import_full_config: true

# Sets up Bluetooth LE (Only on ESP32) to allow the user
# to provision wifi credentials to the device.
esp32_improv:
  authorizer: none

# Serial Improv is omitted on this one factory. USB_SERIAL_JTAG is the MWCP
# console, so another USB serial client cannot share it. Other models still
# include improv_serial through tests/common/_standard_device.yaml. Wi-Fi
# setup remains the fallback AP and captive portal from the base file; BLE
# Improv below is optional and is not an MWCP transport.

# Used to pull OTA updates
http_request:

ota:
  - platform: http_request

update:
  - platform: http_request
    name: Firmware
    source: https://zomco.github.io/mmwave-component/r60abd1-ESP32-C3/manifest.json
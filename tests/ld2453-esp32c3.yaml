substitutions:
  name: ld2453
  friendly_name: "Radar"
esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Restore persisted calibration globals after boot.
          id(radar).set_radar_x(id(g_radar_x));
          id(radar).set_radar_y(id(g_radar_y));
          id(radar).set_radar_z(id(g_radar_z));
          id(radar).set_yaw(id(g_yaw));
          id(radar).set_pitch(id(g_pitch));
          id(radar).set_roll(id(g_roll));
          id(radar).set_distance_min(id(g_distance_min));
          id(radar).set_distance_max(id(g_distance_max));

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components: [ld2453]

logger:

api:

ota:
  platform: esphome

wifi:
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

uart:
  id: uart_ld2453
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 256000
  data_bits: 8
  parity: NONE
  stop_bits: 1

ld2453:
  id: radar
  uart_id: uart_ld2453
  
  radar_x: 0.0
  radar_y: 0.0
  radar_z: 240.0
  yaw: 0.0
  pitch: 0.0
  roll: 0.0
  distance_min: 30.0
  distance_max: 600.0

  presence:
    name: "Presence"

  # 10 Hz atomic target frame consumed by mmwave_fusion.
  target_frame:
    name: "target_frame"
    icon: mdi:radar

  target_1:
    x:
      name: "Target 1 X"
    y:
      name: "Target 1 Y"
    speed:
      name: "Target 1 Speed"
    room_x:
      name: "Target 1 Room X"
    room_y:
      name: "Target 1 Room Y"
    room_z:
      name: "Target 1 Room Z"
    in_boundary:
      name: "Target 1 In Boundary"

  target_2:
    x:
      name: "Target 2 X"
    y:
      name: "Target 2 Y"
    speed:
      name: "Target 2 Speed"
    room_x:
      name: "Target 2 Room X"
    room_y:
      name: "Target 2 Room Y"
    room_z:
      name: "Target 2 Room Z"
    in_boundary:
      name: "Target 2 In Boundary"

  target_3:
    x:
      name: "Target 3 X"
    y:
      name: "Target 3 Y"
    speed:
      name: "Target 3 Speed"
    room_x:
      name: "Target 3 Room X"
    room_y:
      name: "Target 3 Room Y"
    room_z:
      name: "Target 3 Room Z"
    in_boundary:
      name: "Target 3 In Boundary"

globals:
  - id: g_radar_x
    type: float
    restore_value: true # 鎺夌數鎭㈠锛岄伩鍏嶆瘡娆￠噸鍚兘瑕侀噸鏂版牎鍑?    initial_value: "0.0" # 涓婄數榛樿鍊硷紝棣栨鐑у綍鍚庨€氳繃 number 实体覆盖

  - id: g_radar_y
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_radar_z
    type: float
    restore_value: true
    initial_value: "240.0" # LD2453 推荐吸顶/壁挂高度 2.4m

  - id: g_yaw
    type: float
    restore_value: true
    initial_value: "0.0" # 鐢?Lovelace 鍗＄墖鏍″噯鍚庢洿鏂?
  - id: g_pitch
    type: float
    restore_value: true
    initial_value: "0.0" # 姘村钩瀹夎涓?0锛涙枩瑁呮椂濉疄娴嬪€兼垨 IMU 读数

  - id: g_roll
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_distance_min
    type: float
    restore_value: true
    initial_value: "0.0" # 0 cm 鏈€灏忔湁鏁堟帰娴嬭窛绂?
  - id: g_distance_max
    type: float
    restore_value: true
    initial_value: "600.0" # 600 cm 鏈€澶ф湁鏁堣窛绂?
# =============================================================================
# LD2453 组件定义
# =============================================================================

number:
  - platform: template
    name: "Radar X"
    id: num_radar_x
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_x);"
    set_action:
      - lambda: |-
          id(g_radar_x) = x;
          id(radar).set_radar_x(x);
          id(num_radar_x).publish_state(x);

  - platform: template
    name: "Radar Y"
    id: num_radar_y
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_y);"
    set_action:
      - lambda: |-
          id(g_radar_y) = x;
          id(radar).set_radar_y(x);
          id(num_radar_y).publish_state(x);

  - platform: template
    name: "Radar Z"
    id: num_radar_z
    unit_of_measurement: cm
    min_value: 50
    max_value: 400
    step: 1
    mode: box
    icon: mdi:ruler-square
    lambda: "return id(g_radar_z);"
    set_action:
      - lambda: |-
          id(g_radar_z) = x;
          id(radar).set_radar_z(x);
          id(num_radar_z).publish_state(x);

  - platform: template
    name: "Yaw"
    id: num_yaw
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 0.1
    mode: box
    icon: mdi:rotate-3d-variant
    lambda: "return id(g_yaw);"
    set_action:
      - lambda: |-
          id(g_yaw) = x;
          id(radar).set_yaw(x);
          id(num_yaw).publish_state(x);

  - platform: template
    name: "Pitch"
    id: num_pitch
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_pitch);"
    set_action:
      - lambda: |-
          id(g_pitch) = x;
          id(radar).set_pitch(x);
          id(num_pitch).publish_state(x);

  - platform: template
    name: "Roll"
    id: num_roll
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_roll);"
    set_action:
      - lambda: |-
          id(g_roll) = x;
          id(radar).set_roll(x);
          id(num_roll).publish_state(x);

  - platform: template
    name: "Min Distance"
    id: num_distance_min
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 10
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_min);"
    set_action:
      - lambda: |-
          id(g_distance_min) = x;
          id(radar).set_distance_min(x);
          id(num_distance_min).publish_state(x);

  - platform: template
    name: "Max Distance"
    id: num_distance_max
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 10
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_max);"
    set_action:
      - lambda: |-
          id(g_distance_max) = x;
          id(radar).set_distance_max(x);
          id(num_distance_max).publish_state(x);

# =============================================================================
# 鍩虹鐘舵€佷笌璇婃柇浼犳劅鍣?# =============================================================================

select:
  - platform: template
    name: "Tracking Mode"
    id: select_tracking_mode
    options:
      - "Single Target"
      - "Multi Target"
    optimistic: true
    set_action:
      - lambda: |-
          if (x == "Single Target") {
            id(radar).set_tracking_mode(1);
          } else {
            id(radar).set_tracking_mode(2);
          }

button:
  - platform: template
    name: "Factory Reset"
    id: btn_factory_reset
    icon: mdi:factory
    entity_category: config
    on_press:
      - lambda: 'id(radar).factory_reset();'

  - platform: template
    name: "Restart Module"
    id: btn_restart
    icon: mdi:restart
    entity_category: config
    on_press:
      - lambda: 'id(radar).restart_module();'

text:
  - platform: template
    name: "Mock Data"
    id: text_mock_data
    mode: text
    entity_category: diagnostic
    icon: mdi:bug
    optimistic: true
    set_action:
      - lambda: 'id(radar).inject_mock_data(x);'

# =============================================================================
# LD2453 控制实体
# =============================================================================

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 60s

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "SSID"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

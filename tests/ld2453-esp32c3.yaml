substitutions:
  name: ld2453
  friendly_name: "LD2453 Radar"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components: [ld2453]

logger:

api:

ota:
  platform: esphome

wifi:
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

uart:
  id: uart_ld2453
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 256000
  data_bits: 8
  parity: NONE
  stop_bits: 1

ld2453:
  uart_id: uart_ld2453
  presence:
    name: "Presence"

  # ── 多雷达融合入口：10 Hz 原子目标帧（mmwave_fusion 的 frame_entity）──────
  target_frame:
    name: "target_frame"
    icon: mdi:radar

  target_1:
    x:
      name: "Target 1 X"
    y:
      name: "Target 1 Y"
    speed:
      name: "Target 1 Speed"
    resolution:
      name: "Target 1 Resolution"

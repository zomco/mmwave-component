substitutions:
  name: rd03e
  friendly_name: "RD03E Radar"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components: [rd03e]

logger:

api:

ota:
  platform: esphome

wifi:
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

# =============================================================================
# UART (RD03E 默认波特率 256000，8N1)
# =============================================================================

packages:
  radar: !include common/rd03e.yaml

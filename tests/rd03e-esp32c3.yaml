substitutions:
  name: rd03e
  friendly_name: "RD03E Radar"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# ── 外部组件（本地路径） ──────────────────────────────────────────────────────
external_components:
  - source:
      type: local
      path: ../components
    components: [rd03e]

# ── 基础配置 ──────────────────────────────────────────────────────────────────
logger:

api:

ota:
  platform: esphome

wifi:
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

# ── UART（RD03E 默认波特率 256000，8N1） ──────────────────────────────────────
uart:
  id: uart_rd03e
  tx_pin: GPIO21   # ESP32-C3 → RD03E TX（交叉接线）
  rx_pin: GPIO20   # ESP32-C3 ← RD03E RX
  baud_rate: 256000
  data_bits: 8
  parity: NONE
  stop_bits: 1

# ── RD03E 组件 ────────────────────────────────────────────────────────────────
rd03e:
  id: radar
  uart_id: uart_rd03e

  # ── 校准参数 ────────────────────────────────────────────────────────────────
  # 安装位置：以房间左下角为原点，X 向右，Y 向前（cm）
  radar_x: 0.0
  radar_y: 0.0
  radar_z: 240.0        # 距地面安装高度（cm）

  # 安装姿态（度）
  yaw:   0.0
  pitch: 0.0
  roll:  0.0

  # 距离范围过滤（cm），0 = 不过滤
  distance_min: 30.0
  distance_max: 600.0

  # ── 传感器 ──────────────────────────────────────────────────────────────────
  presence:
    name: "presence"
    device_class: presence

  motion_state:
    name: "motion_state"
    # 0=无目标, 1=运动目标, 2=微动目标

  distance:
    name: "distance"
    unit_of_measurement: cm

  # ── 变换后的房间坐标 ──────────────────────────────────────────────────────
  room_x:
    name: "room_x"
  room_y:
    name: "room_y"
  room_z:
    name: "room_z"

  in_boundary:
    name: "in_boundary"

# ── 可选：通过 number 实体在 HA 中实时更新校准参数 ──────────────────────────
number:
  - platform: template
    name: "yaw"
    min_value: -180
    max_value:  180
    step: 0.1
    set_action:
      lambda: "id(radar).set_yaw(x);"

  - platform: template
    name: "pitch"
    min_value: -90
    max_value:  90
    step: 0.5
    set_action:
      lambda: "id(radar).set_pitch(x);"

  - platform: template
    name: "roll"
    min_value: -90
    max_value:  90
    step: 0.5
    set_action:
      lambda: "id(radar).set_roll(x);"

  - platform: template
    name: "radar_x"
    min_value: -2000
    max_value:  2000
    step: 1
    set_action:
      lambda: "id(radar).set_radar_x(x);"

  - platform: template
    name: "radar_y"
    min_value: -2000
    max_value:  2000
    step: 1
    set_action:
      lambda: "id(radar).set_radar_y(x);"

# ── 可选：WiFi 信号强度 ───────────────────────────────────────────────────────
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

substitutions:
  name: "ld2411s-test"
  friendly_name: "LD2411S Test"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: esphome.web
    version: '1.0'

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: "YourSSID"
  password: "YourPassword"

api:
ota:
  - platform: esphome

external_components:
  - source:
      type: local
      path: ../components

uart:
  id: uart_bus
  tx_pin: GPIO4
  rx_pin: GPIO5
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2411s:
  id: radar
  uart_id: uart_bus

  # 安装校准（房间坐标系，cm / °）
  radar_x: 0.0
  radar_y: 0.0
  radar_z: 240.0
  yaw: 0.0
  pitch: 0.0
  roll: 0.0
  # 1-D 雷达使用距离门作为边界；0 = 不过滤
  distance_min: 0.0
  distance_max: 0.0

  distance:
    name: "Distance"
  presence:
    name: "Presence"
  moving_target:
    name: "Moving Target"
  micro_target:
    name: "Micro Target"

  room_x:
    name: "Room X"
  room_y:
    name: "Room Y"
  room_z:
    name: "Room Z"
  in_boundary:
    name: "In Boundary"

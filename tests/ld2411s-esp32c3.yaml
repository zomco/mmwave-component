substitutions:
  name: "ld2411s-test"
  friendly_name: "LD2411S Test"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: esphome.web
    version: '1.0'

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: "YourSSID"
  password: "YourPassword"

api:

ota:
  - platform: esphome

external_components:
  - source:
      type: local
      path: ../components

packages:
  radar: !include common/ld2411s.yaml

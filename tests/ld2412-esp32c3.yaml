substitutions:
  name: ld2412
  friendly_name: "LD2412 Radar"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# ── 外部组件（本地路径） ──────────────────────────────────────────────────────
external_components:
  - source:
      type: local
      path: ../components
    components: [ld2412]

# ── 基础配置 ──────────────────────────────────────────────────────────────────
logger:

api:

ota:
  platform: esphome

wifi:
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

# ── UART（LD2412 默认波特率 115200，8N1） ─────────────────────────────────────
uart:
  id: uart_ld2412
  tx_pin: GPIO21 # ESP32-C3 → LD2412 RX（交叉接线）
  rx_pin: GPIO20 # ESP32-C3 ← LD2412 TX
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

# ── LD2412 组件 ───────────────────────────────────────────────────────────────
ld2412:
  id: radar
  uart_id: uart_ld2412

  # 安装校准（房间坐标系，cm / °）
  radar_x: 0.0
  radar_y: 0.0
  radar_z: 240.0
  yaw: 0.0
  pitch: 0.0
  roll: 0.0
  # 1-D 雷达使用距离门作为边界；0 = 不过滤
  distance_min: 0.0
  distance_max: 900.0 # LD2412 最远 9 m

  presence:
    name: "presence"
    device_class: presence
  target_state:
    name: "target_state"
  moving_distance:
    name: "moving_distance"
  moving_energy:
    name: "moving_energy"
  stationary_distance:
    name: "stationary_distance"
  stationary_energy:
    name: "stationary_energy"
  light:
    name: "light_sensor"

  room_x:
    name: "room_x"
  room_y:
    name: "room_y"
  room_z:
    name: "room_z"
  in_boundary:
    name: "in_boundary"

  # 14 个距离门（0-13）的运动/静止能量
  g0:
    gate_move_energy:
      name: "g0_move_energy"
    gate_still_energy:
      name: "g0_still_energy"
  g1:
    gate_move_energy:
      name: "g1_move_energy"
    gate_still_energy:
      name: "g1_still_energy"
  g2:
    gate_move_energy:
      name: "g2_move_energy"
    gate_still_energy:
      name: "g2_still_energy"
  g3:
    gate_move_energy:
      name: "g3_move_energy"
    gate_still_energy:
      name: "g3_still_energy"
  g4:
    gate_move_energy:
      name: "g4_move_energy"
    gate_still_energy:
      name: "g4_still_energy"
  g5:
    gate_move_energy:
      name: "g5_move_energy"
    gate_still_energy:
      name: "g5_still_energy"
  g6:
    gate_move_energy:
      name: "g6_move_energy"
    gate_still_energy:
      name: "g6_still_energy"
  g7:
    gate_move_energy:
      name: "g7_move_energy"
    gate_still_energy:
      name: "g7_still_energy"
  g8:
    gate_move_energy:
      name: "g8_move_energy"
    gate_still_energy:
      name: "g8_still_energy"
  g9:
    gate_move_energy:
      name: "g9_move_energy"
    gate_still_energy:
      name: "g9_still_energy"
  g10:
    gate_move_energy:
      name: "g10_move_energy"
    gate_still_energy:
      name: "g10_still_energy"
  g11:
    gate_move_energy:
      name: "g11_move_energy"
    gate_still_energy:
      name: "g11_still_energy"
  g12:
    gate_move_energy:
      name: "g12_move_energy"
    gate_still_energy:
      name: "g12_still_energy"
  g13:
    gate_move_energy:
      name: "g13_move_energy"
    gate_still_energy:
      name: "g13_still_energy"

text:
  - platform: template
    name: "Mock Data"
    id: text_mock_data
    min_length: 0
    max_length: 255
    optimistic: true
    mode: text
    icon: mdi:code-json
    set_action:
      - lambda: |-
          id(radar).inject_mock_data(x);

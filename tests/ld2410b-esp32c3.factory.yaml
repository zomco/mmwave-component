packages:
  # The dev config is the single source of truth for this model's hardware,
  # entities and calibration surface. This file only adds what a *shipped*
  # device needs on top of it.
  core: !include ld2410b-esp32c3.yaml

esphome:
  # Identifies the build to ESP Web Tools and to the ESPHome dashboard.
  project:
    name: mmwave.ld2410b
    version: dev # replaced by .github/workflows/publish.yml on release

# Lets a user adopt the flashed device into their own ESPHome dashboard.
dashboard_import:
  package_import_url: github://zomco/mmwave-component/tests/ld2410b-esp32c3.yaml@main
  import_full_config: true

# Wi-Fi provisioning after flashing, over BLE and over serial.
esp32_improv:
  authorizer: none

improv_serial:

# Pulls OTA updates published to the GitHub Pages installer.
http_request:

ota:
  - platform: http_request

update:
  - platform: http_request
    name: Firmware
    source: https://zomco.github.io/mmwave-component/ld2410b-ESP32-C3/manifest.json

# LD2412 radar definition, shared by every consumer.
#
# Included by tests/ld2412-esp32c3.yaml (standalone firmware, and via
# that the factory build users flash) and by the workspace's
# esphome-config/ld2412-esp32c3.yaml. Edit here once.
#
# Carries no board, networking or external_components block on purpose:
# each consumer supplies its own, and two declarations of the same key
# would collide with no way to drop just one.

# Diagnostics and recovery controls are the same on every model, so they live
# in one place rather than being copied into sixteen radar cores.
packages:
  device: !include _device.yaml

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // 开机启动后，将保存在闪存中的 globals 恢复给底层雷达组件
          id(radar).set_radar_x(id(g_radar_x));
          id(radar).set_radar_y(id(g_radar_y));
          id(radar).set_radar_z(id(g_radar_z));
          id(radar).set_yaw(id(g_yaw));
          id(radar).set_pitch(id(g_pitch));
          id(radar).set_roll(id(g_roll));
          id(radar).set_distance_min(id(g_distance_min));
          id(radar).set_distance_max(id(g_distance_max));
          id(radar).set_distance_resolution(id(g_distance_resolution));

uart:
  id: uart_ld2412
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

# =============================================================================
# 校准参数（globals）持久化
# =============================================================================

globals:
  # 安装位置与朝向。room_x / room_y 依赖这些值，此前 ld2412 是唯一没有它们的
  # 型号，坐标只能停留在编译期默认值，装好之后无法校准。
  - id: g_radar_x
    type: float
    restore_value: true # 掉电恢复，避免每次重启都要重新校准
    initial_value: "0.0"
  - id: g_radar_y
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: g_radar_z
    type: float
    restore_value: true
    initial_value: "240.0" # cm，典型吸顶安装高度
  - id: g_yaw
    type: float
    restore_value: true
    initial_value: "0.0" # 由 Lovelace 卡片两点偏航校准后更新
  - id: g_pitch
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: g_roll
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_distance_min
    type: float
    restore_value: true
    initial_value: "0.0" # 0 cm 最小有效探测距离
  - id: g_distance_max
    type: float
    restore_value: true
    initial_value: "900.0" # 900 cm 最大有效距离 (ld2412 max 9m)
  - id: g_distance_resolution
    type: float
    restore_value: true
    initial_value: "0.75" # 默认 0.75m 分辨率

# =============================================================================
# ld2412 组件定义
# =============================================================================

ld2412:
  id: radar
  uart_id: uart_ld2412

  presence:
    name: "Presence"
    device_class: presence
  target_state:
    name: "Target State"
  moving_distance:
    name: "Moving Distance"
    unit_of_measurement: "cm"
  moving_energy:
    name: "Moving Energy"
  stationary_distance:
    name: "Stationary Distance"
    unit_of_measurement: "cm"
  stationary_energy:
    name: "Stationary Energy"
  light:
    name: "Light Sensor"

  g0:
    gate_move_energy:
      name: "G0 Move Energy"
    gate_still_energy:
      name: "G0 Still Energy"
  g1:
    gate_move_energy:
      name: "G1 Move Energy"
    gate_still_energy:
      name: "G1 Still Energy"
  g2:
    gate_move_energy:
      name: "G2 Move Energy"
    gate_still_energy:
      name: "G2 Still Energy"
  g3:
    gate_move_energy:
      name: "G3 Move Energy"
    gate_still_energy:
      name: "G3 Still Energy"
  g4:
    gate_move_energy:
      name: "G4 Move Energy"
    gate_still_energy:
      name: "G4 Still Energy"
  g5:
    gate_move_energy:
      name: "G5 Move Energy"
    gate_still_energy:
      name: "G5 Still Energy"
  g6:
    gate_move_energy:
      name: "G6 Move Energy"
    gate_still_energy:
      name: "G6 Still Energy"
  g7:
    gate_move_energy:
      name: "G7 Move Energy"
    gate_still_energy:
      name: "G7 Still Energy"
  g8:
    gate_move_energy:
      name: "G8 Move Energy"
    gate_still_energy:
      name: "G8 Still Energy"
  g9:
    gate_move_energy:
      name: "G9 Move Energy"
    gate_still_energy:
      name: "G9 Still Energy"
  g10:
    gate_move_energy:
      name: "G10 Move Energy"
    gate_still_energy:
      name: "G10 Still Energy"
  g11:
    gate_move_energy:
      name: "G11 Move Energy"
    gate_still_energy:
      name: "G11 Still Energy"
  g12:
    gate_move_energy:
      name: "G12 Move Energy"
    gate_still_energy:
      name: "G12 Still Energy"
  g13:
    gate_move_energy:
      name: "G13 Move Energy"
    gate_still_energy:
      name: "G13 Still Energy"

  # carried over from the component config
  radar_x: 0.0
  # carried over from the component config
  radar_y: 0.0
  # carried over from the component config
  radar_z: 240.0
  # carried over from the component config
  yaw: 0.0
  # carried over from the component config
  pitch: 0.0
  # carried over from the component config
  roll: 0.0
  # 1-D 雷达使用距离门作为边界；0 = 不过滤
  # carried over from the component config
  distance_min: 0.0
  # carried over from the component config
  distance_max: 900.0 # LD2412 最远 9 m

  # carried over from the component config
  room_x:
    name: "Room X"
  # carried over from the component config
  room_y:
    name: "Room Y"
  # carried over from the component config
  room_z:
    name: "Room Z"
  # carried over from the component config
  in_boundary:
    name: "In Boundary"

  # 14 个距离门（0-13）的运动/静止能量

# =============================================================================
# Number 实体（接收 Lovelace 卡片或 HA 自动化写入的校准参数）
# =============================================================================
# 与其余型号一致：set_action 写入 global 并立即下发给组件，无需重启。
# ld2412 此前缺少整个 number 块，是唯一无法在运行时校准的型号。

number:
  - platform: template
    name: "Radar X"
    entity_category: config
    id: num_radar_x
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_x);"
    set_action:
      - lambda: |-
          id(g_radar_x) = x;
          id(radar).set_radar_x(x);
          id(num_radar_x).publish_state(x);

  - platform: template
    name: "Radar Y"
    entity_category: config
    id: num_radar_y
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_y);"
    set_action:
      - lambda: |-
          id(g_radar_y) = x;
          id(radar).set_radar_y(x);
          id(num_radar_y).publish_state(x);

  - platform: template
    name: "Radar Z"
    entity_category: config
    id: num_radar_z
    unit_of_measurement: cm
    min_value: 50
    max_value: 400
    step: 1
    mode: box
    icon: mdi:ruler-square
    lambda: "return id(g_radar_z);"
    set_action:
      - lambda: |-
          id(g_radar_z) = x;
          id(radar).set_radar_z(x);
          id(num_radar_z).publish_state(x);

  - platform: template
    name: "Yaw"
    entity_category: config
    id: num_yaw
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 0.1
    mode: box
    icon: mdi:rotate-3d-variant
    lambda: "return id(g_yaw);"
    set_action:
      - lambda: |-
          id(g_yaw) = x;
          id(radar).set_yaw(x);
          id(num_yaw).publish_state(x);

  - platform: template
    name: "Pitch"
    entity_category: config
    id: num_pitch
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_pitch);"
    set_action:
      - lambda: |-
          id(g_pitch) = x;
          id(radar).set_pitch(x);
          id(num_pitch).publish_state(x);

  - platform: template
    name: "Roll"
    entity_category: config
    id: num_roll
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_roll);"
    set_action:
      - lambda: |-
          id(g_roll) = x;
          id(radar).set_roll(x);
          id(num_roll).publish_state(x);

text:
  - platform: template
    # "Mock Data", not "ld2412_test_device Mock Data". Home Assistant already
    # prefixes the device name, so the longer form produced
    # text.ld2412_test_device_ld2412_test_device_mock_data — the only model
    # spelled differently from the other eleven, and a name nothing could
    # reasonably guess.
    name: "Mock Data"
    entity_category: diagnostic
    id: text_ld2412_mock_data
    mode: text
    optimistic: true
    # set_action, not on_value. on_value fires only when the value *changes*,
    # so replaying the same frame twice — which is how the e2e harness gets past
    # the 1 Hz publish rate limit — silently did nothing the second time.
    set_action:
      - lambda: |-
          id(radar).inject_mock_data(x.c_str());

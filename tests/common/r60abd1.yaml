# R60ABD1 radar definition, shared by every consumer.
#
# Included by tests/r60abd1-esp32c3.yaml (standalone firmware, and via
# that the factory build users flash) and by the workspace's
# esphome-config/r60abd1-esp32c3.yaml. Edit here once.
#
# Carries no board, networking or external_components block on purpose:
# each consumer supplies its own, and two declarations of the same key
# would collide with no way to drop just one.

# Diagnostics and recovery controls are the same on every model, so they live
# in one place rather than being copied into sixteen radar cores.
packages:
  device: !include _device.yaml

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // 开机启动后，将保存在闪存中的 globals 恢复给底层雷达组件
          id(radar).set_radar_x(id(g_radar_x));
          id(radar).set_radar_y(id(g_radar_y));
          id(radar).set_radar_z(id(g_radar_z));
          id(radar).set_yaw(id(g_yaw));
          id(radar).set_pitch(id(g_pitch));
          id(radar).set_roll(id(g_roll));

          if (!id(g_polygon).empty()) {
            id(text_polygon).publish_state(id(g_polygon));
          }
      - script.execute: apply_polygon

script:
  - id: apply_polygon
    mode: restart
    then:
      - lambda: |-
          // 解析 "x1,y1;x2,y2;..." 形式的多边形字符串。
          //
          // 这里绝不能用 std::stof。ESPHome 的 esp-idf 构建关闭了 C++ 异常
          // (sdkconfig: CONFIG_COMPILER_CXX_EXCEPTIONS is not set)，std::stof
          // 遇到非法输入会 std::terminate() -> abort()，也就是用户在 HA 的
          // 文本框里随手打错一个字符就会把雷达重启。
          //
          // 改用 strtof + endptr 校验：非法的点跳过并告警，其余照常应用。
          id(radar).clear_polygon();
          const std::string s = id(g_polygon);
          size_t start = 0;
          uint8_t added = 0;
          uint8_t rejected = 0;
          // 上限同时防住超长输入撑爆内存。
          while (start <= s.size() && added < 64) {
            const size_t sep = s.find(';', start);
            const std::string pt =
                (sep == std::string::npos) ? s.substr(start) : s.substr(start, sep - start);
            start = (sep == std::string::npos) ? s.size() + 1 : sep + 1;
            if (pt.empty()) continue;

            const size_t comma = pt.find(',');
            if (comma == std::string::npos) { rejected++; continue; }

            const std::string xs = pt.substr(0, comma);
            const std::string ys = pt.substr(comma + 1);
            char *xend = nullptr;
            char *yend = nullptr;
            const float px = strtof(xs.c_str(), &xend);
            const float py = strtof(ys.c_str(), &yend);
            // endptr 未前进 = 完全没解析出数字；再挡掉 inf/nan。
            if (xend == xs.c_str() || yend == ys.c_str() ||
                !std::isfinite(px) || !std::isfinite(py)) {
              rejected++;
              continue;
            }

            id(radar).add_polygon_point(px, py);
            added++;
          }
          if (rejected > 0)
            ESP_LOGW("polygon", "Ignored %u malformed point(s) in polygon string", rejected);
          ESP_LOGI("polygon", "Applied %u polygon point(s)", added);

# Reference the component from the submodule mount.

uart:
  id: uart_r60abd1
  tx_pin: GPIO21 # ESP32-C3 → R60ABD1 TXD（交叉接线）
  rx_pin: GPIO20 # ESP32-C3 ← R60ABD1 RXD
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

# =============================================================================
# 5. 校准参数（globals）
# =============================================================================
# globals 在运行时可被 number 实体的 set_action 更新，
# 用于 component 的 set_*() 调用以实现不重新编译就能校准。

globals:
  - id: g_radar_x
    type: float
    restore_value: true # 掉电恢复，避免每次重启都要重新校准
    initial_value: "0.0" # 上电默认值，首次烧录后通过 number 实体覆盖

  - id: g_radar_y
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_radar_z
    type: float
    restore_value: true
    initial_value: "220.0" # cm，典型卧室吸顶安装高度

  - id: g_yaw
    type: float
    restore_value: true
    initial_value: "0.0" # 由 Lovelace 卡片两点偏航校准后更新

  - id: g_pitch
    type: float
    restore_value: true
    initial_value: "0.0" # 水平安装为 0；斜装时填实测值或 IMU 读数

  - id: g_roll
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_polygon
    type: std::string
    restore_value: true
    max_restore_data_length: 254
    initial_value: '""'

# =============================================================================
# 6. R60ABD1 组件核心配置
# =============================================================================

r60abd1:
  id: radar # 供 lambda 调用：id(radar).enable_breath() 等
  uart_id: uart_r60abd1

  # ── 编译期校准参数（初始值；运行时可被 number 实体覆盖）─────────────────
  # 说明：组件 setup() 时用这些值初始化；number 实体 set_action 之后调用
  # id(radar).set_yaw(x) 实时更新，无需重启。
  radar_x: 0.0 # 雷达在房间中的 X 位置（cm，房间左下角为原点）
  radar_y: 0.0 # Y 位置（cm）
  radar_z: 220.0 # 安装高度（cm）
  yaw: 0.0 # 偏航角（°，由校准卡片填写）
  pitch: 0.0 # 俯仰角（°）
  roll: 0.0 # 横滚角（°）

  # ── 房间边界多边形（房间坐标系，cm）─────────────────────────────────────
  # 修改后需重新编译固件。
  # Lovelace 卡片前端也有独立的多边形过滤（存 localStorage），两者独立工作。
  # 示例：400cm×350cm 矩形房间，去掉门口 100cm 宽的区域
  polygon:
    - { x: 0, y: 0 }
    - { x: 400, y: 0 }
    - { x: 400, y: 350 }
    - { x: 0, y: 350 }
  # 若不需要 ESPHome 侧边界过滤，清空 polygon 列表：
  # polygon: []

  # ── 存在与运动传感器 ─────────────────────────────────────────────────────

  presence:
    name: "Presence"
    device_class: presence
    # 状态：on = 有人，off = 无人
    # 无人→有人：0.5s 内上报；有人→无人：40s 后上报（R60ABD1 内部逻辑）

  # 多雷达融合入口：与 LD2450 系列同一个 v1 原子帧信封。
  target_frame:
    name: "Target Frame"
    icon: mdi:radar

  motion_state:
    name: "Motion State"
    # 0 = 无  1 = 静止  2 = 活跃
    icon: mdi:motion-sensor

  body_movement:
    name: "Body Movement"
    # 体动幅度参数 0-100，1s 更新一次
    icon: mdi:run-fast

  body_distance:
    name: "Body Distance"
    unit_of_measurement: cm
    icon: mdi:ruler
    device_class: distance

  # ── 原始坐标（雷达局部坐标系，供 Lovelace 卡片读取）─────────────────────
  # Lovelace 卡片直接读这三个实体，在前端用 localStorage 里的校准参数做变换。
  # 不要在 HA 自动化中直接使用这三个值做位置判断，请用 room_x / room_y。

  raw_x:
    name: "X" # HA 实体 ID: sensor.r60abd1_radar_x
    unit_of_measurement: cm
    icon: mdi:axis-x-arrow
    # internal: true           # 如果只想对外暴露变换后坐标，取消注释此行

  raw_y:
    name: "Y" # HA 实体 ID: sensor.r60abd1_radar_y
    unit_of_measurement: cm
    icon: mdi:axis-y-arrow

  raw_z:
    name: "Z" # HA 实体 ID: sensor.r60abd1_radar_z
    unit_of_measurement: cm
    icon: mdi:axis-z-arrow

  # ── 变换后坐标（房间坐标系，供 HA 自动化使用）────────────────────────────
  # 这两个值已经过 yaw/pitch/roll/位置 变换，直接对应房间平面图坐标。
  # 边界外目标：当前实现中仍会发布（值为目标实际房间坐标），
  # 配合 in_boundary 实体在自动化中过滤。

  room_x:
    name: "Room X" # HA 实体 ID: sensor.r60abd1_radar_room_x
    unit_of_measurement: cm
    icon: mdi:map-marker-radius
    accuracy_decimals: 1

  room_y:
    name: "Room Y" # HA 实体 ID: sensor.r60abd1_radar_room_y
    unit_of_measurement: cm
    icon: mdi:map-marker-radius
    accuracy_decimals: 1

  room_z:
    name: "Height Floor" # 目标距地面高度（cm）= radar_z - Z_transformed
    unit_of_measurement: cm
    icon: mdi:human-male-height
    accuracy_decimals: 1

  in_boundary:
    name: "In Boundary" # on = 在多边形内，off = 在多边形外
    icon: mdi:vector-polygon

  # ── 呼吸 ────────────────────────────────────────────────────────────────────

  breath_value:
    name: "Breath Rate" # 呼吸频率，每 3s 更新一次，范围 0-35 次/min
    unit_of_measurement: "次/min"
    icon: mdi:lungs

  breath_state:
    name: "Breath State" # normal / high / low / none
    icon: mdi:lungs

  # ── 心率 ────────────────────────────────────────────────────────────────────

  heart_rate:
    name: "Heart Rate" # 心率，每 3s 更新一次，范围 60-120 bpm
    unit_of_measurement: bpm
    icon: mdi:heart-pulse
    device_class: frequency

  # ── 睡眠监测 ────────────────────────────────────────────────────────────────

  in_bed:
    name: "In Bed" # on = 入床，off = 离床
    icon: mdi:bed

  sleep_state:
    name: "Sleep State" # deep / light / awake / none（每 10min 更新）
    icon: mdi:sleep

  awake_duration:
    name: "Awake Duration" # 清醒累计时长（min）
    unit_of_measurement: min
    icon: mdi:timer-outline

  light_sleep_duration:
    name: "Light Sleep Duration"
    unit_of_measurement: min
    icon: mdi:sleep

  deep_sleep_duration:
    name: "Deep Sleep Duration"
    unit_of_measurement: min
    icon: mdi:sleep

  sleep_score:
    name: "Sleep Score" # 0-100，睡眠结束时上报
    icon: mdi:star-circle

  sleep_quality:
    name: "Sleep Quality" # good / fair / poor / none
    icon: mdi:star-circle-outline

# =============================================================================
# 7. Number 实体（接收 Lovelace 卡片或 HA 自动化写入的校准参数）
# =============================================================================
# Lovelace 卡片点击「保存」时，会调用 number.set_value 服务更新这些实体。
# set_action 将值写入 globals 并立即更新组件，无需重启固件。

number:
  - platform: template
    name: "Radar X"
    entity_category: config
    id: num_radar_x
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_x);"
    set_action:
      - lambda: |-
          id(g_radar_x) = x;
          id(radar).set_radar_x(x);
          id(num_radar_x).publish_state(x);

  - platform: template
    name: "Radar Y"
    entity_category: config
    id: num_radar_y
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_y);"
    set_action:
      - lambda: |-
          id(g_radar_y) = x;
          id(radar).set_radar_y(x);
          id(num_radar_y).publish_state(x);

  - platform: template
    name: "Radar Z"
    entity_category: config
    id: num_radar_z
    unit_of_measurement: cm
    min_value: 50
    max_value: 400
    step: 1
    mode: box
    icon: mdi:ruler-square
    lambda: "return id(g_radar_z);"
    set_action:
      - lambda: |-
          id(g_radar_z) = x;
          id(radar).set_radar_z(x);
          id(num_radar_z).publish_state(x);

  - platform: template
    name: "Yaw"
    entity_category: config
    id: num_yaw
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 0.1
    mode: box
    icon: mdi:rotate-3d-variant
    lambda: "return id(g_yaw);"
    set_action:
      - lambda: |-
          id(g_yaw) = x;
          id(radar).set_yaw(x);
          id(num_yaw).publish_state(x);

  - platform: template
    name: "Pitch"
    entity_category: config
    id: num_pitch
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_pitch);"
    set_action:
      - lambda: |-
          id(g_pitch) = x;
          id(radar).set_pitch(x);
          id(num_pitch).publish_state(x);

  - platform: template
    name: "Roll"
    entity_category: config
    id: num_roll
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_roll);"
    set_action:
      - lambda: |-
          id(g_roll) = x;
          id(radar).set_roll(x);
          id(num_roll).publish_state(x);

# =============================================================================
# 8. Button 实体（远程控制雷达模组）
# =============================================================================

button:
  - platform: template
    name: "Restart Module"
    entity_category: config
    icon: mdi:restart
    on_press:
      - lambda: "id(radar).reset_module();"

# 通用诊断传感器（WiFi Signal / Uptime / Status / IP / SSID / MAC）和重启按钮
# 已移入 _device.yaml，由本文件顶部的 packages 引入。

# =============================================================================
# 9. Text 实体（接收 Lovelace 卡片下发的多边形字符串）
# =============================================================================

text:
  - platform: template
    name: "Polygon Config"
    entity_category: config
    id: text_polygon
    min_length: 0
    max_length: 255
    optimistic: true
    mode: text
    icon: mdi:vector-polygon
    set_action:
      - lambda: |-
          id(g_polygon) = x;
      - script.execute: apply_polygon

  - platform: template
    name: "Mock Data"
    entity_category: diagnostic
    id: text_mock_data
    min_length: 0
    max_length: 255
    optimistic: true
    mode: text
    icon: mdi:test-tube
    set_action:
      - lambda: |-
          id(radar).inject_mock_data(x);

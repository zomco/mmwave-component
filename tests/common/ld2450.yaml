# LD2450 radar definition, shared by every consumer.
#
# Included by tests/ld2450-esp32c3.yaml (standalone firmware, and via
# that the factory build users flash) and by the workspace's
# esphome-config/ld2450-esp32c3.yaml. Edit here once.
#
# Carries no board, networking or external_components block on purpose:
# each consumer supplies its own, and two declarations of the same key
# would collide with no way to drop just one.

# Diagnostics and recovery controls are the same on every model, so they live
# in one place rather than being copied into sixteen radar cores.
packages:
  device: !include _device.yaml

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // 开机启动后，将保存在闪存中的 globals 恢复给底层雷达组件
          id(radar).set_radar_x(id(g_radar_x));
          id(radar).set_radar_y(id(g_radar_y));
          id(radar).set_radar_z(id(g_radar_z));
          id(radar).set_yaw(id(g_yaw));
          id(radar).set_pitch(id(g_pitch));
          id(radar).set_roll(id(g_roll));
          id(radar).set_distance_min(id(g_distance_min));
          id(radar).set_distance_max(id(g_distance_max));

          if (!id(g_polygon).empty()) {
            id(text_polygon).publish_state(id(g_polygon));
          }
      - script.execute: apply_polygon

script:
  - id: apply_polygon
    mode: restart
    then:
      - lambda: |-
          // 解析 "x1,y1;x2,y2;..." 形式的多边形字符串。
          //
          // 这里绝不能用 std::stof。ESPHome 的 esp-idf 构建关闭了 C++ 异常
          // (sdkconfig: CONFIG_COMPILER_CXX_EXCEPTIONS is not set)，std::stof
          // 遇到非法输入会 std::terminate() -> abort()，也就是用户在 HA 的
          // 文本框里随手打错一个字符就会把雷达重启。
          //
          // 改用 strtof + endptr 校验：非法的点跳过并告警，其余照常应用。
          id(radar).clear_polygon();
          const std::string s = id(g_polygon);
          size_t start = 0;
          uint8_t added = 0;
          uint8_t rejected = 0;
          // 上限同时防住超长输入撑爆内存。
          while (start <= s.size() && added < 64) {
            const size_t sep = s.find(';', start);
            const std::string pt =
                (sep == std::string::npos) ? s.substr(start) : s.substr(start, sep - start);
            start = (sep == std::string::npos) ? s.size() + 1 : sep + 1;
            if (pt.empty()) continue;

            const size_t comma = pt.find(',');
            if (comma == std::string::npos) { rejected++; continue; }

            const std::string xs = pt.substr(0, comma);
            const std::string ys = pt.substr(comma + 1);
            char *xend = nullptr;
            char *yend = nullptr;
            const float px = strtof(xs.c_str(), &xend);
            const float py = strtof(ys.c_str(), &yend);
            // endptr 未前进 = 完全没解析出数字；再挡掉 inf/nan。
            if (xend == xs.c_str() || yend == ys.c_str() ||
                !std::isfinite(px) || !std::isfinite(py)) {
              rejected++;
              continue;
            }

            id(radar).add_polygon_point(px, py);
            added++;
          }
          if (rejected > 0)
            ESP_LOGW("polygon", "Ignored %u malformed point(s) in polygon string", rejected);
          ESP_LOGI("polygon", "Applied %u polygon point(s)", added);

uart:
  id: uart_ld2450
  tx_pin: GPIO21   # ESP32-C3 → LD2450 RX（交叉接线）
  rx_pin: GPIO20   # ESP32-C3 ← LD2450 TX
  baud_rate: 256000
  data_bits: 8
  parity: NONE
  stop_bits: 1

globals:
  - id: g_radar_x
    type: float
    restore_value: true # 掉电恢复，避免每次重启都要重新校准
    initial_value: "0.0" # 上电默认值，首次烧录后通过 number 实体覆盖

  - id: g_radar_y
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_radar_z
    type: float
    restore_value: true
    initial_value: "150.0" # LD2450 推荐高度

  - id: g_yaw
    type: float
    restore_value: true
    initial_value: "0.0" # 由 Lovelace 卡片两点偏航校准后更新

  - id: g_pitch
    type: float
    restore_value: true
    initial_value: "0.0" # 水平安装为 0；斜装时填实测值或 IMU 读数

  - id: g_roll
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_distance_min
    type: float
    restore_value: true
    initial_value: "0.0" # 0 cm = 不设最小距离

  - id: g_distance_max
    type: float
    restore_value: true
    initial_value: "0.0" # 0 cm = 不设最大距离

  - id: g_polygon
    type: std::string
    restore_value: true
    max_restore_data_length: 254
    initial_value: '""'

ld2450:
  id: radar
  uart_id: uart_ld2450

  presence:
    name: "Presence"
    device_class: presence
  target_frame:
    name: "Target Frame"
    icon: mdi:radar
  presence_timeout: 5s

  multi_target:
    name: "Multi Target Mode"
  bluetooth:
    name: "Bluetooth"
  restart:
    name: "Restart Module"
  factory_reset:
    name: "Factory Reset"

  target_1_x:
    name: "Target 1 X"
  target_1_y:
    name: "Target 1 Y"
  target_1_speed:
    name: "Target 1 Speed"
  target_1_resolution:
    name: "Target 1 Resolution"
    internal: true
  target_1_distance:
    name: "Target 1 Distance"
  target_1_angle:
    name: "Target 1 Angle"
  target_1_room_x:
    name: "Target 1 Room X"
  target_1_room_y:
    name: "Target 1 Room Y"
  target_1_active:
    name: "Target 1 Active"
  target_1_in_boundary:
    name: "Target 1 In Boundary"

  target_2_x:
    name: "Target 2 X"
  target_2_y:
    name: "Target 2 Y"
  target_2_speed:
    name: "Target 2 Speed"
  target_2_resolution:
    name: "Target 2 Resolution"
    internal: true
  target_2_distance:
    name: "Target 2 Distance"
  target_2_angle:
    name: "Target 2 Angle"
  target_2_room_x:
    name: "Target 2 Room X"
  target_2_room_y:
    name: "Target 2 Room Y"
  target_2_active:
    name: "Target 2 Active"
  target_2_in_boundary:
    name: "Target 2 In Boundary"

  target_3_x:
    name: "Target 3 X"
  target_3_y:
    name: "Target 3 Y"
  target_3_speed:
    name: "Target 3 Speed"
  target_3_resolution:
    name: "Target 3 Resolution"
    internal: true
  target_3_distance:
    name: "Target 3 Distance"
  target_3_angle:
    name: "Target 3 Angle"
  target_3_room_x:
    name: "Target 3 Room X"
  target_3_room_y:
    name: "Target 3 Room Y"
  target_3_active:
    name: "Target 3 Active"
  target_3_in_boundary:
    name: "Target 3 In Boundary"

  # carried over from the component config
  radar_x: 0.0 # 雷达在房间中的 X 位置（cm，房间左下角为原点）
  # carried over from the component config
  radar_y: 0.0 # Y 位置（cm）
  # carried over from the component config
  radar_z: 150.0 # 安装高度（cm）
  # carried over from the component config
  yaw: 0.0 # 偏航角（°，由校准卡片填写）
  # carried over from the component config
  pitch: 0.0 # 俯仰角（°）
  # carried over from the component config
  roll: 0.0 # 横滚角（°）

  # ── 全局存在检测 ─────────────────────────────────────────────────────────
  # carried over from the component config
  zone_filter:
    type: exclude
    zones:
      - { x1: -100.0, y1: 100.0, x2: 100.0, y2: 500.0 }

  # ── 控制实体（CI 需覆盖这些 codegen 路径）──────────────────────────────

number:
  - platform: template
    name: "Zone Min Distance"
    entity_category: config
    id: num_distance_min
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 10
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_min);"
    set_action:
      - lambda: |-
          id(g_distance_min) = x;
          id(radar).set_distance_min(x);
          id(num_distance_min).publish_state(x);

  - platform: template
    name: "Zone Max Distance"
    entity_category: config
    id: num_distance_max
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 10
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_max);"
    set_action:
      - lambda: |-
          id(g_distance_max) = x;
          id(radar).set_distance_max(x);
          id(num_distance_max).publish_state(x);

  - platform: template
    name: "Mount X"
    entity_category: config
    id: num_radar_x
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_x);"
    set_action:
      - lambda: |-
          id(g_radar_x) = x;
          id(radar).set_radar_x(x);
          id(num_radar_x).publish_state(x);

  - platform: template
    name: "Mount Y"
    entity_category: config
    id: num_radar_y
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_y);"
    set_action:
      - lambda: |-
          id(g_radar_y) = x;
          id(radar).set_radar_y(x);
          id(num_radar_y).publish_state(x);

  - platform: template
    name: "Mount Z"
    entity_category: config
    id: num_radar_z
    unit_of_measurement: cm
    min_value: 50
    max_value: 400
    step: 1
    mode: box
    icon: mdi:ruler-square
    lambda: "return id(g_radar_z);"
    set_action:
      - lambda: |-
          id(g_radar_z) = x;
          id(radar).set_radar_z(x);
          id(num_radar_z).publish_state(x);

  - platform: template
    name: "Mount Yaw"
    entity_category: config
    id: num_yaw
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 0.1
    mode: box
    icon: mdi:rotate-3d-variant
    lambda: "return id(g_yaw);"
    set_action:
      - lambda: |-
          id(g_yaw) = x;
          id(radar).set_yaw(x);
          id(num_yaw).publish_state(x);

  - platform: template
    name: "Mount Pitch"
    entity_category: config
    id: num_pitch
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_pitch);"
    set_action:
      - lambda: |-
          id(g_pitch) = x;
          id(radar).set_pitch(x);
          id(num_pitch).publish_state(x);

  - platform: template
    name: "Mount Roll"
    entity_category: config
    id: num_roll
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_roll);"
    set_action:
      - lambda: |-
          id(g_roll) = x;
          id(radar).set_roll(x);
          id(num_roll).publish_state(x);

button:
  # 诊断用：setup() 里的 query_state() 在 WiFi 起来之前就跑完了，
  # 网络日志永远看不到它的 ACK，所以提供一个可随时触发的按钮。
  - platform: template
    name: "Query Radar State"
    icon: mdi:help-network
    on_press:
      - lambda: "id(radar).query_state();"

  - platform: template
    name: "Query Zone Filter"
    icon: mdi:selection-search
    on_press:
      - lambda: "id(radar).query_zone_config();"

text:
  - platform: template
    name: "Zone Polygon"
    entity_category: config
    id: text_polygon
    min_length: 0
    max_length: 255
    optimistic: true
    mode: text
    icon: mdi:vector-polygon
    set_action:
      - lambda: |-
          id(g_polygon) = x;
      - script.execute: apply_polygon

  - platform: template
    name: "Mock Data"
    entity_category: diagnostic
    id: text_mock_data
    min_length: 0
    max_length: 255
    optimistic: true
    mode: text
    icon: mdi:code-json
    set_action:
      - lambda: |-
          id(radar).inject_mock_data(x);

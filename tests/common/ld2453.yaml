# LD2453 radar definition, shared by every consumer.
#
# Included by tests/ld2453-esp32c3.yaml (standalone firmware, and via
# that the factory build users flash) and by the workspace's
# esphome-config/ld2453-esp32c3.yaml. Edit here once.
#
# Carries no board, networking or external_components block on purpose:
# each consumer supplies its own, and two declarations of the same key
# would collide with no way to drop just one.

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Restore persisted calibration globals after boot.
          id(radar).set_radar_x(id(g_radar_x));
          id(radar).set_radar_y(id(g_radar_y));
          id(radar).set_radar_z(id(g_radar_z));
          id(radar).set_yaw(id(g_yaw));
          id(radar).set_pitch(id(g_pitch));
          id(radar).set_roll(id(g_roll));
          id(radar).set_distance_min(id(g_distance_min));
          id(radar).set_distance_max(id(g_distance_max));

uart:
  id: uart_ld2453
  tx_pin: GPIO21   # ESP32-C3 鈫?LD2453 RX（交叉接线）
  rx_pin: GPIO20   # ESP32-C3 鈫?LD2453 TX
  baud_rate: 256000
  data_bits: 8
  parity: NONE
  stop_bits: 1

# =============================================================================
# 校准参数（globals）持久化
# =============================================================================

globals:
  - id: g_radar_x
    type: float
    restore_value: true # 鎺夌數鎭㈠锛岄伩鍏嶆瘡娆￠噸鍚兘瑕侀噸鏂版牎鍑?    initial_value: "0.0" # 涓婄數榛樿鍊硷紝棣栨鐑у綍鍚庨€氳繃 number 实体覆盖

  - id: g_radar_y
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_radar_z
    type: float
    restore_value: true
    initial_value: "240.0" # LD2453 推荐吸顶/壁挂高度 2.4m

  - id: g_yaw
    type: float
    restore_value: true
    initial_value: "0.0" # 鐢?Lovelace 鍗＄墖鏍″噯鍚庢洿鏂?
  - id: g_pitch
    type: float
    restore_value: true
    initial_value: "0.0" # 姘村钩瀹夎涓?0锛涙枩瑁呮椂濉疄娴嬪€兼垨 IMU 读数

  - id: g_roll
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_distance_min
    type: float
    restore_value: true
    initial_value: "0.0" # 0 cm 鏈€灏忔湁鏁堟帰娴嬭窛绂?
  - id: g_distance_max
    type: float
    restore_value: true
    initial_value: "600.0" # 600 cm 鏈€澶ф湁鏁堣窛绂?
# =============================================================================
# LD2453 组件定义
# =============================================================================

ld2453:
  id: radar
  uart_id: uart_ld2453

  # 鈹€鈹€ 存在探测 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  presence:
    name: "presence"
    device_class: presence

  target_frame:
    name: "target_frame"

  # 鈹€鈹€ 鐩爣 1 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€

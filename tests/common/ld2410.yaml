# LD2410 radar definition, shared by every consumer.
#
# Included by tests/ld2410-esp32c3.yaml (standalone firmware, and via
# that the factory build users flash) and by the workspace's
# esphome-config/ld2410-esp32c3.yaml. Edit here once.
#
# Carries no board, networking or external_components block on purpose:
# each consumer supplies its own, and two declarations of the same key
# would collide with no way to drop just one.

# Diagnostics and recovery controls are the same on every model, so they live
# in one place rather than being copied into sixteen radar cores.
packages:
  device: !include _device.yaml

uart:
  id: uart_bus
  tx_pin: GPIO4
  rx_pin: GPIO5
  baud_rate: 256000

number:
  - platform: template
    name: "Mount Yaw"
    entity_category: config
    id: radar_yaw
    min_value: -180
    max_value: 180
    step: 1
    initial_value: 0
    optimistic: true
  - platform: template
    name: "Radar Pitch"
    id: radar_pitch
    min_value: -90
    max_value: 90
    step: 1
    initial_value: 0
    optimistic: true

ld2410:
  id: my_radar
  uart_id: uart_bus
  
  radar_x: 0.0
  radar_y: 0.0
  radar_z: 240.0
  yaw: 0.0
  pitch: 0.0
  roll: 0.0
  
  distance_min: 0.0
  distance_max: 300.0

  presence:
    name: "Presence"
  target_state:
    name: "Target State"
  moving_distance:
    name: "Moving Distance"
  moving_energy:
    name: "Moving Energy"
  stationary_distance:
    name: "Stationary Distance"
  stationary_energy:
    name: "Stationary Energy"
  detection_distance:
    name: "Detection Distance"
  
  room_x:
    name: "Room X"
  room_y:
    name: "Room Y"
  room_z:
    name: "Room Z"
  in_boundary:
    name: "In Boundary"

# =============================================================================
# 诊断
# =============================================================================
#
# 组件一直有 inject_mock_data()，但没有实体调用它，所以这个型号无法在没有硬件
# 的情况下回放帧——其余十二个型号都可以。
#
# 名称写 "Mock Data" 而不是带型号前缀的形式：Home Assistant 已经会加设备名。
# 用 set_action 而不是 on_value——on_value 只在值*变化*时触发，同一帧连续注入
# 两次时第二次会被静默丢弃。

text:
  - platform: template
    name: "Mock Data"
    id: text_mock_data
    mode: text
    optimistic: true
    entity_category: diagnostic
    icon: mdi:bug
    set_action:
      - lambda: 'id(my_radar).inject_mock_data(x);'


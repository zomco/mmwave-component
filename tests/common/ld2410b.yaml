# LD2410B radar definition, shared by every consumer.
#
# Included by tests/ld2410b-esp32c3.yaml (standalone firmware, and via
# that the factory build users flash) and by the workspace's
# esphome-config/ld2410b-esp32c3.yaml. Edit here once.
#
# Carries no board, networking or external_components block on purpose:
# each consumer supplies its own, and two declarations of the same key
# would collide with no way to drop just one.

# Diagnostics and recovery controls are the same on every model, so they live
# in one place rather than being copied into sixteen radar cores.
packages:
  device: !include _device.yaml

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // 开机启动后，将保存在闪存中的 globals 恢复给底层雷达组件
          id(radar).set_radar_x(id(g_radar_x));
          id(radar).set_radar_y(id(g_radar_y));
          id(radar).set_radar_z(id(g_radar_z));
          id(radar).set_yaw(id(g_yaw));
          id(radar).set_pitch(id(g_pitch));
          id(radar).set_roll(id(g_roll));
          id(radar).set_distance_min(id(g_distance_min));
          id(radar).set_distance_max(id(g_distance_max));

uart:
  id: uart_ld2410b
  tx_pin: GPIO21   # ESP32-C3 → LD2410B RX（交叉接线）
  rx_pin: GPIO20   # ESP32-C3 ← LD2410B TX
  baud_rate: 256000
  data_bits: 8
  parity: NONE
  stop_bits: 1

# =============================================================================
# 校准参数（globals）持久化
# =============================================================================
#
# 只保存 ESP 侧的坐标变换参数。雷达自身的配置（最大距离门、无人持续时间、
# 灵敏度、距离分辨率、光感辅助控制）掉电不丢失，由雷达自己保存，组件在
# setup() 时读回，因此不需要在这里再存一份 —— 两份配置一旦不一致，
# 就再也说不清哪一份是真的。

globals:
  - id: g_radar_x
    type: float
    restore_value: true # 掉电恢复，避免每次重启都要重新校准
    initial_value: "0.0" # 上电默认值，首次烧录后通过 number 实体覆盖

  - id: g_radar_y
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_radar_z
    type: float
    restore_value: true
    initial_value: "240.0" # LD2410B 推荐吸顶/壁挂高度 2.4m

  - id: g_yaw
    type: float
    restore_value: true
    initial_value: "0.0" # 由 Lovelace 卡片校准后更新

  - id: g_pitch
    type: float
    restore_value: true
    initial_value: "0.0" # 水平安装为 0；斜装时填实测值或 IMU 读数

  - id: g_roll
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_distance_min
    type: float
    restore_value: true
    initial_value: "0.0" # 0 cm 最小有效探测距离

  - id: g_distance_max
    type: float
    restore_value: true
    initial_value: "600.0" # 600 cm 最大有效距离

# =============================================================================
# LD2410B 组件定义
# =============================================================================

ld2410b:
  id: radar
  uart_id: uart_ld2410b

  # ── 存在探测、目标距离与状态 ────────────────────────────────────────────────────
  presence:
    name: "Presence"
    device_class: presence
  target_state:
    name: "Target State"
  moving_distance:
    name: "Moving Distance"
    unit_of_measurement: "cm"
  moving_energy:
    name: "Moving Energy"
  stationary_distance:
    name: "Stationary Distance"
    unit_of_measurement: "cm"
  stationary_energy:
    name: "Stationary Energy"
  detection_distance:
    name: "Detection Distance"
    unit_of_measurement: "cm"
  max_distance:
    name: "Max Distance"
    unit_of_measurement: "cm"

  # ── 工程模式附加数据（协议表 15）────────────────────────────────────────────
  # 模块自带光敏二极管；OUT 引脚状态在开启光感辅助控制后会与 presence 不同。
  light:
    name: "Light"
  out_pin:
    name: "OUT Pin"

  # ── 坐标转换与区域过滤 ────────────────────────────────────────────────
  room_x:
    name: "Room X"
    unit_of_measurement: "cm"
  room_y:
    name: "Room Y"
    unit_of_measurement: "cm"
  room_z:
    name: "Room Z"
    unit_of_measurement: "cm"
  in_boundary:
    name: "In Boundary"

  # ── 雷达自身配置回读（协议 2.2.4 / 2.2.8 / 2.2.17 / 2.2.21）──────────────
  # 发布的是雷达答复的值，而不是写进去的值：写失败时看得见。
  firmware_version:
    name: "Firmware Version"
  max_moving_gate:
    name: "Max Moving Gate"
  max_still_gate:
    name: "Max Still Gate"
  unmanned_duration:
    name: "Unmanned Duration"
  distance_resolution:
    name: "Distance Resolution"
  gate_sensitivity:
    name: "Gate Sensitivity"
  noise_floor_status:
    name: "Noise Floor Status"

  # ── 各距离门能量值（工程模式）──────────────────────────────────────────────
  # 9 个距离门，每门运动/静止各一个。组件一直在解析它们，之前没有实体承接，
  # 于是这半个协议在 Home Assistant 里根本不存在。
  g0:
    gate_move_energy:
      name: "G0 Move Energy"
    gate_still_energy:
      name: "G0 Still Energy"
  g1:
    gate_move_energy:
      name: "G1 Move Energy"
    gate_still_energy:
      name: "G1 Still Energy"
  g2:
    gate_move_energy:
      name: "G2 Move Energy"
    gate_still_energy:
      name: "G2 Still Energy"
  g3:
    gate_move_energy:
      name: "G3 Move Energy"
    gate_still_energy:
      name: "G3 Still Energy"
  g4:
    gate_move_energy:
      name: "G4 Move Energy"
    gate_still_energy:
      name: "G4 Still Energy"
  g5:
    gate_move_energy:
      name: "G5 Move Energy"
    gate_still_energy:
      name: "G5 Still Energy"
  g6:
    gate_move_energy:
      name: "G6 Move Energy"
    gate_still_energy:
      name: "G6 Still Energy"
  g7:
    gate_move_energy:
      name: "G7 Move Energy"
    gate_still_energy:
      name: "G7 Still Energy"
  g8:
    gate_move_energy:
      name: "G8 Move Energy"
    gate_still_energy:
      name: "G8 Still Energy"

# =============================================================================
# 运行时校准控制实体 (number)
# =============================================================================

number:
  - platform: template
    name: "Radar X"
    entity_category: config
    id: num_radar_x
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_x);"
    set_action:
      - lambda: |-
          id(g_radar_x) = x;
          id(radar).set_radar_x(x);
          id(num_radar_x).publish_state(x);

  - platform: template
    name: "Radar Y"
    entity_category: config
    id: num_radar_y
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_y);"
    set_action:
      - lambda: |-
          id(g_radar_y) = x;
          id(radar).set_radar_y(x);
          id(num_radar_y).publish_state(x);

  - platform: template
    name: "Radar Z"
    entity_category: config
    id: num_radar_z
    unit_of_measurement: cm
    min_value: 50
    max_value: 400
    step: 1
    mode: box
    icon: mdi:ruler-square
    lambda: "return id(g_radar_z);"
    set_action:
      - lambda: |-
          id(g_radar_z) = x;
          id(radar).set_radar_z(x);
          id(num_radar_z).publish_state(x);

  - platform: template
    name: "Yaw"
    entity_category: config
    id: num_yaw
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 0.1
    mode: box
    icon: mdi:rotate-3d-variant
    lambda: "return id(g_yaw);"
    set_action:
      - lambda: |-
          id(g_yaw) = x;
          id(radar).set_yaw(x);
          id(num_yaw).publish_state(x);

  - platform: template
    name: "Pitch"
    entity_category: config
    id: num_pitch
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_pitch);"
    set_action:
      - lambda: |-
          id(g_pitch) = x;
          id(radar).set_pitch(x);
          id(num_pitch).publish_state(x);

  - platform: template
    name: "Roll"
    entity_category: config
    id: num_roll
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_roll);"
    set_action:
      - lambda: |-
          id(g_roll) = x;
          id(radar).set_roll(x);
          id(num_roll).publish_state(x);

  - platform: template
    name: "Min Distance"
    entity_category: config
    id: num_distance_min
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 10
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_min);"
    set_action:
      - lambda: |-
          id(g_distance_min) = x;
          id(radar).set_distance_min(x);
          id(num_distance_min).publish_state(x);

  - platform: template
    name: "Max Distance"
    entity_category: config
    id: num_distance_max
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 10
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_max);"
    set_action:
      - lambda: |-
          id(g_distance_max) = x;
          id(radar).set_distance_max(x);
          id(num_distance_max).publish_state(x);

# =============================================================================
# 雷达自身参数写入实体 (number / select)
# =============================================================================
#
# 这些实体写的是雷达模块的配置，掉电不丢失，由雷达保存。它们的读数来自组件
# 缓存的「雷达答复值」，所以写失败时数值会退回原样，而不是停在你输入的值上。

  - platform: template
    name: "Max Moving Gate"
    id: num_max_moving_gate
    update_interval: 10s
    min_value: 2
    max_value: 8
    step: 1
    mode: box
    icon: mdi:signal-distance-variant
    lambda: "return id(radar).get_max_moving_gate();"
    set_action:
      - lambda: "id(radar).set_max_moving_gate((uint8_t) x);"

  - platform: template
    name: "Max Still Gate"
    id: num_max_still_gate
    update_interval: 10s
    min_value: 2
    max_value: 8
    step: 1
    mode: box
    icon: mdi:signal-distance-variant
    lambda: "return id(radar).get_max_still_gate();"
    set_action:
      - lambda: "id(radar).set_max_still_gate((uint8_t) x);"

  - platform: template
    name: "Unmanned Duration"
    id: num_unmanned_duration
    update_interval: 10s
    unit_of_measurement: s
    min_value: 0
    max_value: 65535
    step: 1
    mode: box
    icon: mdi:timer-sand
    lambda: "return id(radar).get_unmanned_duration();"
    set_action:
      - lambda: "id(radar).set_unmanned_duration((uint16_t) x);"

  # 统一设置全部距离门的灵敏度（协议 2.2.7 的 0xFFFF 门号）。逐门配置的
  # 雷达没有单一数值可显示，此时读数为空，实际值见 gate_sensitivity 文本传感器。
  - platform: template
    name: "Move Sensitivity (All Gates)"
    id: num_move_sensitivity
    update_interval: 10s
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    icon: mdi:tune
    lambda: |-
      float v = id(radar).get_uniform_move_sensitivity();
      if (std::isnan(v)) return {};
      return v;
    set_action:
      - lambda: |-
          float still = id(radar).get_uniform_still_sensitivity();
          if (std::isnan(still)) still = x;
          id(radar).set_gate_sensitivity(0xFFFF, (uint8_t) x, (uint8_t) still);

  - platform: template
    name: "Still Sensitivity (All Gates)"
    id: num_still_sensitivity
    update_interval: 10s
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    icon: mdi:tune
    lambda: |-
      float v = id(radar).get_uniform_still_sensitivity();
      if (std::isnan(v)) return {};
      return v;
    set_action:
      - lambda: |-
          float move = id(radar).get_uniform_move_sensitivity();
          if (std::isnan(move)) move = x;
          id(radar).set_gate_sensitivity(0xFFFF, (uint8_t) move, (uint8_t) x);

  - platform: template
    name: "Light Threshold"
    id: num_light_threshold
    update_interval: 10s
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    icon: mdi:brightness-percent
    lambda: "return id(radar).get_light_threshold();"
    set_action:
      - lambda: "id(radar).set_light_threshold((uint8_t) x);"

# =============================================================================
# 运行时配置实体 (select)
# =============================================================================

select:
  # 协议 2.2.16：距离分辨率决定每个距离门代表多远，配置值重启模块后才生效。
  # 因此这里只下发命令，不改本地换算：在模块重启前，下拉框会退回雷达当前
  # 真正在用的分辨率，而不是假装已经切过去了。
  - platform: template
    name: "Distance Resolution"
    id: select_distance_resolution
    update_interval: 10s
    icon: mdi:ruler
    options:
      - "0.75m"
      - "0.20m"
    lambda: |-
      if (id(radar).get_distance_resolution() < 0.5f) return {"0.20m"};
      return {"0.75m"};
    set_action:
      - lambda: "id(radar).request_distance_resolution(x == \"0.20m\" ? 1 : 0);"

  # 协议 2.2.18：光感辅助控制。开启后 OUT 引脚同时受雷达检测结果与光感条件
  # 约束，presence 与 out_pin 会出现差异。
  - platform: template
    name: "Light Control Mode"
    id: select_light_control
    update_interval: 10s
    icon: mdi:brightness-auto
    options:
      - "Off"
      - "Below threshold"
      - "Above threshold"
    lambda: |-
      switch (id(radar).get_light_control_mode()) {
        case 1: return {"Below threshold"};
        case 2: return {"Above threshold"};
        default: return {"Off"};
      }
    set_action:
      - lambda: |-
          uint8_t mode = 0;
          if (x == "Below threshold") mode = 1;
          else if (x == "Above threshold") mode = 2;
          id(radar).set_light_control_mode(mode);

  - platform: template
    name: "OUT Pin Idle Level"
    id: select_out_pin_level
    update_interval: 10s
    icon: mdi:electric-switch
    options:
      - "Low"
      - "High"
    lambda: |-
      if (id(radar).get_out_pin_level() != 0) return {"High"};
      return {"Low"};
    set_action:
      - lambda: "id(radar).set_out_pin_level(x == \"High\" ? 1 : 0);"

# =============================================================================
# 雷达命令按钮
# =============================================================================

button:
  - platform: template
    name: "Query Radar Config"
    entity_category: diagnostic
    icon: mdi:help-network
    on_press:
      - lambda: |-
          id(radar).query_parameters();
          id(radar).query_distance_resolution();
          id(radar).query_light_control();
          id(radar).query_firmware_version();
          id(radar).query_noise_floor_status();

  # 协议 2.2.20：下发后模块等 10 秒再开始统计底噪，期间探测范围内必须无人，
  # 完成后自动为每个距离门配置灵敏度。执行状态见 noise_floor_status。
  - platform: template
    name: "Calibrate Noise Floor"
    icon: mdi:waveform
    on_press:
      - lambda: "id(radar).start_noise_floor_calibration(10);"

  - platform: template
    name: "Factory Reset"
    id: btn_factory_reset
    icon: mdi:factory
    on_press:
      - lambda: "id(radar).factory_reset();"

  - platform: template
    name: "Restart Module"
    id: btn_restart_module
    icon: mdi:restart
    on_press:
      - lambda: "id(radar).restart_module();"

# =============================================================================
# 基础状态与诊断传感器
# =============================================================================

text:
  - platform: template
    name: "Mock Data"
    id: text_mock_data
    mode: text
    entity_category: diagnostic
    icon: mdi:bug
    optimistic: true
    set_action:
      - lambda: |-
          id(radar).inject_mock_data(x);

# LD6002 radar definition, shared by every consumer.
#
# Included by tests/ld6002-esp32c3.yaml (standalone firmware, and via
# that the factory build users flash) and by the workspace's
# esphome-config/ld6002-esp32c3.yaml. Edit here once.
#
# Carries no board, networking or external_components block on purpose:
# each consumer supplies its own, and two declarations of the same key
# would collide with no way to drop just one.

# Diagnostics and recovery controls are the same on every model, so they live
# in one place rather than being copied into sixteen radar cores.
packages:
  device: !include _device.yaml

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // 开机启动后，将保存在闪存中的 globals 恢复给底层雷达组件
          id(radar).set_radar_x(id(g_radar_x));
          id(radar).set_radar_y(id(g_radar_y));
          id(radar).set_radar_z(id(g_radar_z));
          id(radar).set_yaw(id(g_yaw));
          id(radar).set_pitch(id(g_pitch));
          id(radar).set_roll(id(g_roll));
          id(radar).set_distance_min(id(g_distance_min));
          id(radar).set_distance_max(id(g_distance_max));

uart:
  id: uart_ld6002
  tx_pin: GPIO21   # ESP32-C3 → LD6002 RX（交叉接线）
  rx_pin: GPIO20   # ESP32-C3 ← LD6002 TX
  baud_rate: 1382400
  data_bits: 8
  parity: NONE
  stop_bits: 1

# =============================================================================
# 校准参数（globals）持久化
# =============================================================================

globals:
  - id: g_radar_x
    type: float
    restore_value: true # 掉电恢复，避免每次重启都要重新校准
    initial_value: "0.0" # 上电默认值，首次烧录后通过 number 实体覆盖

  - id: g_radar_y
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_radar_z
    type: float
    restore_value: true
    initial_value: "240.0" # LD6002 推荐吸顶高度 2.4m

  - id: g_yaw
    type: float
    restore_value: true
    initial_value: "0.0" # 由 Lovelace 卡片校准后更新

  - id: g_pitch
    type: float
    restore_value: true
    initial_value: "0.0" # 水平安装为 0；斜装时填实测值或 IMU 读数

  - id: g_roll
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_distance_min
    type: float
    restore_value: true
    initial_value: "40.0" # 40 cm 最小有效探测距离

  - id: g_distance_max
    type: float
    restore_value: true
    initial_value: "600.0" # 600 cm 最大有效距离

# =============================================================================
# LD6002 组件定义
# =============================================================================

ld6002:
  id: radar
  uart_id: uart_ld6002

  # ── 存在探测、距离与生命体征 ────────────────────────────────────────────────────
  presence:
    name: "Presence"
    device_class: presence
  distance:
    name: "Distance"
    unit_of_measurement: "cm"
  respiration_rate:
    name: "Respiration Rate"
    unit_of_measurement: "bpm"
  heart_rate:
    name: "Heart Rate"
    unit_of_measurement: "bpm"

  # ── 坐标转换与区域过滤 ────────────────────────────────────────────────
  room_x:
    name: "Room X"
    unit_of_measurement: "cm"
  room_y:
    name: "Room Y"
    unit_of_measurement: "cm"
  room_z:
    name: "Room Z"
    unit_of_measurement: "cm"
  in_boundary:
    name: "In Boundary"

# =============================================================================
# 运行时校准控制实体 (number)
# =============================================================================

  # carried over from the component config
  radar_x: 0.0
  # carried over from the component config
  radar_y: 0.0
  # carried over from the component config
  radar_z: 240.0
  # carried over from the component config
  yaw: 0.0
  # carried over from the component config
  pitch: 0.0
  # carried over from the component config
  roll: 0.0

number:
  - platform: template
    name: "Mount X"
    entity_category: config
    id: num_radar_x
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_x);"
    set_action:
      - lambda: |-
          id(g_radar_x) = x;
          id(radar).set_radar_x(x);
          id(num_radar_x).publish_state(x);

  - platform: template
    name: "Mount Y"
    entity_category: config
    id: num_radar_y
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_y);"
    set_action:
      - lambda: |-
          id(g_radar_y) = x;
          id(radar).set_radar_y(x);
          id(num_radar_y).publish_state(x);

  - platform: template
    name: "Mount Z"
    entity_category: config
    id: num_radar_z
    unit_of_measurement: cm
    min_value: 50
    max_value: 400
    step: 1
    mode: box
    icon: mdi:ruler-square
    lambda: "return id(g_radar_z);"
    set_action:
      - lambda: |-
          id(g_radar_z) = x;
          id(radar).set_radar_z(x);
          id(num_radar_z).publish_state(x);

  - platform: template
    name: "Mount Yaw"
    entity_category: config
    id: num_yaw
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 0.1
    mode: box
    icon: mdi:rotate-3d-variant
    lambda: "return id(g_yaw);"
    set_action:
      - lambda: |-
          id(g_yaw) = x;
          id(radar).set_yaw(x);
          id(num_yaw).publish_state(x);

  - platform: template
    name: "Mount Pitch"
    entity_category: config
    id: num_pitch
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_pitch);"
    set_action:
      - lambda: |-
          id(g_pitch) = x;
          id(radar).set_pitch(x);
          id(num_pitch).publish_state(x);

  - platform: template
    name: "Mount Roll"
    entity_category: config
    id: num_roll
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_roll);"
    set_action:
      - lambda: |-
          id(g_roll) = x;
          id(radar).set_roll(x);
          id(num_roll).publish_state(x);

  - platform: template
    name: "Zone Min Distance"
    entity_category: config
    id: num_distance_min
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 10
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_min);"
    set_action:
      - lambda: |-
          id(g_distance_min) = x;
          id(radar).set_distance_min(x);
          id(num_distance_min).publish_state(x);

  - platform: template
    name: "Zone Max Distance"
    entity_category: config
    id: num_distance_max
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 10
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_max);"
    set_action:
      - lambda: |-
          id(g_distance_max) = x;
          id(radar).set_distance_max(x);
          id(num_distance_max).publish_state(x);

# =============================================================================
# 基础状态与诊断传感器
# =============================================================================

# =============================================================================
# 诊断
# =============================================================================
#
# 名称写 "Mock Data" 而不是带型号前缀的形式：Home Assistant 已经会加设备名。
# 用 set_action 而不是 on_value——on_value 只在值*变化*时触发，同一帧连续注入
# 两次时第二次会被静默丢弃。

text:
  - platform: template
    name: "Mock Data"
    id: text_mock_data
    mode: text
    optimistic: true
    entity_category: diagnostic
    icon: mdi:bug
    set_action:
      - lambda: 'id(radar).inject_mock_data(x);'


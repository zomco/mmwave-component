    entity_category: config
    id: num_distance_min
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 5
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_min);"
    set_action:
      - lambda: |-
          id(g_distance_min) = x;
          id(radar).set_distance_min(x);
          id(num_distance_min).publish_state(x);

  - platform: template
    name: "Zone Max Distance"
    entity_category: config
    id: num_distance_max
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 5
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_max);"
    set_action:
      - lambda: |-
          id(g_distance_max) = x;
          id(radar).set_distance_max(x);
          id(num_distance_max).publish_state(x);

# =============================================================================
# 雷达自身参数写入实体（协议 1.2.3 / 1.2.5）
# =============================================================================
#
# 这些实体写的是雷达模块的配置，掉电不丢失，由雷达保存。读数来自组件缓存的
# 「雷达答复值」，所以写失败时数值会退回原样，而不是停在你输入的值上。
#
# 四个检测参数在协议里是一条命令的四个字节，灵敏度参数同理，因此改任意一个
# 都会把该组参数整体重发一次 —— 组件用上一次查询的结果补齐其余字段。

  - platform: template
    name: "Max Detection Distance"
    id: num_max_detection_distance
    update_interval: 10s
    unit_of_measurement: m
    min_value: 10
    max_value: 255
    step: 1
    mode: box
    icon: mdi:signal-distance-variant
    lambda: "return id(radar).get_max_detection_distance();"
    set_action:
      - lambda: "id(radar).set_max_detection_distance((uint8_t) x);"

  - platform: template
    name: "Min Speed"
    id: num_min_speed
    update_interval: 10s
    unit_of_measurement: "km/h"
    min_value: 0
    max_value: 120
    step: 1
    mode: box
    icon: mdi:speedometer-slow
    lambda: "return id(radar).get_min_speed();"
    set_action:
      - lambda: "id(radar).set_min_speed((uint8_t) x);"

  - platform: template
    name: "No Target Delay"
    id: num_no_target_delay
    update_interval: 10s
    unit_of_measurement: s
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    icon: mdi:timer-sand
    lambda: "return id(radar).get_no_target_delay();"
    set_action:
      - lambda: "id(radar).set_no_target_delay((uint8_t) x);"

  - platform: template
    name: "Trigger Count"
    id: num_trigger_count
    update_interval: 10s
    min_value: 1
    max_value: 10
    step: 1
    mode: box
    icon: mdi:counter
    lambda: "return id(radar).get_trigger_count();"
    set_action:
      - lambda: "id(radar).set_trigger_count((uint8_t) x);"

select:
  # 协议 1.2.3：只检测远离 / 只检测靠近 / 均检测。
  - platform: template
    name: "Direction Filter"
    id: select_direction_filter
    update_interval: 10s
    icon: mdi:swap-horizontal
    options:
      - "Away only"
      - "Approaching only"
      - "Both"
    lambda: |-
      switch (id(radar).get_direction_filter()) {
        case 0: return {"Away only"};
        case 1: return {"Approaching only"};
        default: return {"Both"};
      }
    set_action:
      - lambda: |-
          uint8_t dir = 2;
          if (x == "Away only") dir = 0;
          else if (x == "Approaching only") dir = 1;
          id(radar).set_direction_filter(dir);

  # 协议 1.2.5：0 表示沿用雷达自带默认值（4），3~8 可配，越大越不灵敏。
  # 用 select 而不是 number，是因为 1 和 2 不是合法取值。
  - platform: template
    name: "SNR Threshold"
    id: select_snr_threshold
    update_interval: 10s
    icon: mdi:tune
    options:
      - "Radar default"
      - "3"
      - "4"
      - "5"
      - "6"
      - "7"
      - "8"
    lambda: |-
      uint8_t level = id(radar).get_snr_threshold();
      if (level < 3 || level > 8) return {"Radar default"};
      return {esphome::to_string(level)};
    set_action:
      - lambda: |-
          uint8_t level = 0;
          if (x != "Radar default") level = (uint8_t) atoi(x.c_str());
          id(radar).set_snr_threshold(level);

button:
  - platform: template
    name: "Query Radar Config"
    entity_category: diagnostic
    icon: mdi:help-network
    on_press:
      - lambda: |-
          id(radar).query_detection_params();
          id(radar).query_sensitivity_params();
          id(radar).query_firmware_version();

  - platform: template
    name: "Factory Reset"
    id: btn_factory_reset
    icon: mdi:factory
    on_press:
      - lambda: 'id(radar).factory_reset();'

  - platform: template
    name: "Restart Module"
    id: btn_restart
    icon: mdi:restart
    on_press:
      - lambda: 'id(radar).restart_module();'

text:
  - platform: template
    name: "Zone Polygon"
    entity_category: config
    id: text_polygon
    min_length: 0
    max_length: 255
    optimistic: true
    mode: text
    icon: mdi:vector-polygon
    set_action:
      - lambda: |-
          id(g_polygon) = x;
      - script.execute: apply_polygon

  - platform: template
    name: "Mock Data"
    id: text_mock_data
    mode: text
    entity_category: diagnostic
    icon: mdi:bug
    optimistic: true
    set_action:
      - lambda: 'id(radar).inject_mock_data(x);'

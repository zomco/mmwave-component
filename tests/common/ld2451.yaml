# LD2451 radar definition, shared by every consumer.
#
# Included by tests/ld2451-esp32c3.yaml (standalone firmware, and via
# that the factory build users flash) and by the workspace's
# esphome-config/ld2451-esp32c3.yaml. Edit here once.
#
# Carries no board, networking or external_components block on purpose:
# each consumer supplies its own, and two declarations of the same key
# would collide with no way to drop just one.

# Diagnostics and recovery controls are the same on every model, so they live
# in one place rather than being copied into sixteen radar cores.
packages:
  device: !include _device.yaml

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(radar).set_radar_x(id(g_radar_x));
          id(radar).set_radar_y(id(g_radar_y));
          id(radar).set_radar_z(id(g_radar_z));
          id(radar).set_yaw(id(g_yaw));
          id(radar).set_pitch(id(g_pitch));
          id(radar).set_roll(id(g_roll));
          id(radar).set_distance_min(id(g_distance_min));
          id(radar).set_distance_max(id(g_distance_max));

uart:
  id: uart_ld2451
  tx_pin: GPIO21   # ESP32-C3 TX -> LD2451 RX
  rx_pin: GPIO20   # ESP32-C3 RX <- LD2451 TX
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

globals:
  - id: g_radar_x
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_radar_y
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_radar_z
    type: float
    restore_value: true
    initial_value: "240.0"

  - id: g_yaw
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_pitch
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_roll
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_distance_min
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_distance_max
    type: float
    restore_value: true
    initial_value: "600.0"

ld2451:
  id: radar
  uart_id: uart_ld2451

  presence:
    name: "presence"
    device_class: presence

  alarm:
    name: "alarm"

  target_count:
    name: "target_count"

  target_frame:
    name: "target_frame"

  # ── 雷达自身配置回读（协议 1.2.4 / 1.2.6 / 1.2.7）────────────────────────
  # 发布的是雷达答复的值，而不是写进去的值：写失败时看得见。
  firmware_version:
    name: "firmware_version"
  max_detection_distance:
    name: "max_detection_distance"
  direction_filter:
    name: "direction_filter"
  min_speed:
    name: "min_speed"
  no_target_delay:
    name: "no_target_delay"
  trigger_count:
    name: "trigger_count"
  snr_threshold:
    name: "snr_threshold"

  target_1:
    distance:
      name: "target_1_distance"
    angle:
      name: "target_1_angle"
    speed:
      name: "target_1_speed"
    snr:
      name: "target_1_snr"
    x:
      name: "target_1_x"
    y:
      name: "target_1_y"
    room_x:
      name: "target_1_room_x"
    room_y:
      name: "target_1_room_y"
    room_z:
      name: "target_1_room_z"
    in_boundary:
      name: "target_1_in_boundary"

  target_2:
    distance:
      name: "target_2_distance"
    angle:
      name: "target_2_angle"
    speed:
      name: "target_2_speed"
    snr:
      name: "target_2_snr"
    x:
      name: "target_2_x"
    y:
      name: "target_2_y"
    room_x:
      name: "target_2_room_x"
    room_y:
      name: "target_2_room_y"
    room_z:
      name: "target_2_room_z"
    in_boundary:
      name: "target_2_in_boundary"

  target_3:
    distance:
      name: "target_3_distance"
    angle:
      name: "target_3_angle"
    speed:
      name: "target_3_speed"
    snr:
      name: "target_3_snr"
    x:
      name: "target_3_x"
    y:
      name: "target_3_y"
    room_x:
      name: "target_3_room_x"
    room_y:
      name: "target_3_room_y"
    room_z:
      name: "target_3_room_z"
    in_boundary:
      name: "target_3_in_boundary"

number:
  - platform: template
    name: "Radar X"
    id: num_radar_x
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_x);"
    set_action:
      - lambda: |-
          id(g_radar_x) = x;
          id(radar).set_radar_x(x);
          id(num_radar_x).publish_state(x);

  - platform: template
    name: "Radar Y"
    id: num_radar_y
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_y);"
    set_action:
      - lambda: |-
          id(g_radar_y) = x;
          id(radar).set_radar_y(x);
          id(num_radar_y).publish_state(x);

  - platform: template
    name: "Radar Z"
    id: num_radar_z
    unit_of_measurement: cm
    min_value: 50
    max_value: 400
    step: 1
    mode: box
    icon: mdi:ruler-square
    lambda: "return id(g_radar_z);"
    set_action:
      - lambda: |-
          id(g_radar_z) = x;
          id(radar).set_radar_z(x);
          id(num_radar_z).publish_state(x);

  - platform: template
    name: "Yaw"
    id: num_yaw
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 0.1
    mode: box
    icon: mdi:rotate-3d-variant
    lambda: "return id(g_yaw);"
    set_action:
      - lambda: |-
          id(g_yaw) = x;
          id(radar).set_yaw(x);
          id(num_yaw).publish_state(x);

  - platform: template
    name: "Pitch"
    id: num_pitch
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_pitch);"
    set_action:
      - lambda: |-
          id(g_pitch) = x;
          id(radar).set_pitch(x);
          id(num_pitch).publish_state(x);

  - platform: template
    name: "Roll"
    id: num_roll
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_roll);"
    set_action:
      - lambda: |-
          id(g_roll) = x;
          id(radar).set_roll(x);
          id(num_roll).publish_state(x);

  - platform: template
    name: "Distance Min"
    id: num_distance_min
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 5
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_min);"
    set_action:
      - lambda: |-
          id(g_distance_min) = x;
          id(radar).set_distance_min(x);
          id(num_distance_min).publish_state(x);

  - platform: template
    name: "Distance Max"
    id: num_distance_max
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 5
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_max);"
    set_action:
      - lambda: |-
          id(g_distance_max) = x;
          id(radar).set_distance_max(x);
          id(num_distance_max).publish_state(x);

# =============================================================================
# 雷达自身参数写入实体（协议 1.2.3 / 1.2.5）
# =============================================================================
#
# 这些实体写的是雷达模块的配置，掉电不丢失，由雷达保存。读数来自组件缓存的
# 「雷达答复值」，所以写失败时数值会退回原样，而不是停在你输入的值上。
#
# 四个检测参数在协议里是一条命令的四个字节，灵敏度参数同理，因此改任意一个
# 都会把该组参数整体重发一次 —— 组件用上一次查询的结果补齐其余字段。

  - platform: template
    name: "Max Detection Distance"
    id: num_max_detection_distance
    update_interval: 10s
    entity_category: config
    unit_of_measurement: m
    min_value: 10
    max_value: 255
    step: 1
    mode: box
    icon: mdi:signal-distance-variant
    lambda: "return id(radar).get_max_detection_distance();"
    set_action:
      - lambda: "id(radar).set_max_detection_distance((uint8_t) x);"

  - platform: template
    name: "Min Speed"
    id: num_min_speed
    update_interval: 10s
    entity_category: config
    unit_of_measurement: "km/h"
    min_value: 0
    max_value: 120
    step: 1
    mode: box
    icon: mdi:speedometer-slow
    lambda: "return id(radar).get_min_speed();"
    set_action:
      - lambda: "id(radar).set_min_speed((uint8_t) x);"

  - platform: template
    name: "No Target Delay"
    id: num_no_target_delay
    update_interval: 10s
    entity_category: config
    unit_of_measurement: s
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    icon: mdi:timer-sand
    lambda: "return id(radar).get_no_target_delay();"
    set_action:
      - lambda: "id(radar).set_no_target_delay((uint8_t) x);"

  - platform: template
    name: "Trigger Count"
    id: num_trigger_count
    update_interval: 10s
    entity_category: config
    min_value: 1
    max_value: 10
    step: 1
    mode: box
    icon: mdi:counter
    lambda: "return id(radar).get_trigger_count();"
    set_action:
      - lambda: "id(radar).set_trigger_count((uint8_t) x);"

select:
  # 协议 1.2.3：只检测远离 / 只检测靠近 / 均检测。
  - platform: template
    name: "Direction Filter"
    id: select_direction_filter
    update_interval: 10s
    entity_category: config
    icon: mdi:swap-horizontal
    options:
      - "Away only"
      - "Approaching only"
      - "Both"
    lambda: |-
      switch (id(radar).get_direction_filter()) {
        case 0: return {"Away only"};
        case 1: return {"Approaching only"};
        default: return {"Both"};
      }
    set_action:
      - lambda: |-
          uint8_t dir = 2;
          if (x == "Away only") dir = 0;
          else if (x == "Approaching only") dir = 1;
          id(radar).set_direction_filter(dir);

  # 协议 1.2.5：0 表示沿用雷达自带默认值（4），3~8 可配，越大越不灵敏。
  # 用 select 而不是 number，是因为 1 和 2 不是合法取值。
  - platform: template
    name: "SNR Threshold"
    id: select_snr_threshold
    update_interval: 10s
    entity_category: config
    icon: mdi:tune
    options:
      - "Radar default"
      - "3"
      - "4"
      - "5"
      - "6"
      - "7"
      - "8"
    lambda: |-
      uint8_t level = id(radar).get_snr_threshold();
      if (level < 3 || level > 8) return {"Radar default"};
      return {esphome::to_string(level)};
    set_action:
      - lambda: |-
          uint8_t level = 0;
          if (x != "Radar default") level = (uint8_t) atoi(x.c_str());
          id(radar).set_snr_threshold(level);

button:
  - platform: template
    name: "Query Radar Config"
    entity_category: diagnostic
    icon: mdi:help-network
    on_press:
      - lambda: |-
          id(radar).query_detection_params();
          id(radar).query_sensitivity_params();
          id(radar).query_firmware_version();

  - platform: template
    name: "Factory Reset"
    id: btn_factory_reset
    icon: mdi:factory
    entity_category: config
    on_press:
      - lambda: 'id(radar).factory_reset();'

  - platform: template
    name: "Restart Module"
    id: btn_restart
    icon: mdi:restart
    entity_category: config
    on_press:
      - lambda: 'id(radar).restart_module();'

text:
  - platform: template
    name: "Mock Data"
    id: text_mock_data
    mode: text
    entity_category: diagnostic
    icon: mdi:bug
    optimistic: true
    set_action:
      - lambda: 'id(radar).inject_mock_data(x);'

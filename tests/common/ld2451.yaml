# LD2451 radar definition, shared by every consumer.
#
# Included by tests/ld2451-esp32c3.yaml (standalone firmware, and via
# that the factory build users flash) and by the workspace's
# esphome-config/ld2451-esp32c3.yaml. Edit here once.
#
# Carries no board, networking or external_components block on purpose:
# each consumer supplies its own, and two declarations of the same key
# would collide with no way to drop just one.

# Diagnostics and recovery controls are the same on every model, so they live
# in one place rather than being copied into sixteen radar cores.
packages:
  device: !include _device.yaml

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(radar).set_radar_x(id(g_radar_x));
          id(radar).set_radar_y(id(g_radar_y));
          id(radar).set_radar_z(id(g_radar_z));
          id(radar).set_yaw(id(g_yaw));
          id(radar).set_pitch(id(g_pitch));
          id(radar).set_roll(id(g_roll));
          id(radar).set_distance_min(id(g_distance_min));
          id(radar).set_distance_max(id(g_distance_max));

          if (!id(g_polygon).empty()) {
            id(text_polygon).publish_state(id(g_polygon));
          }
      - script.execute: apply_polygon

script:
  - id: apply_polygon
    mode: restart
    then:
      - lambda: |-
          // 解析 "x1,y1;x2,y2;..." 形式的多边形字符串。
          //
          // 这里绝不能用 std::stof。ESPHome 的 esp-idf 构建关闭了 C++ 异常
          // (sdkconfig: CONFIG_COMPILER_CXX_EXCEPTIONS is not set)，std::stof
          // 遇到非法输入会 std::terminate() -> abort()，也就是用户在 HA 的
          // 文本框里随手打错一个字符就会把雷达重启。
          //
          // 改用 strtof + endptr 校验：非法的点跳过并告警，其余照常应用。
          id(radar).clear_polygon();
          const std::string s = id(g_polygon);
          size_t start = 0;
          uint8_t added = 0;
          uint8_t rejected = 0;
          // 上限同时防住超长输入撑爆内存。
          while (start <= s.size() && added < 64) {
            const size_t sep = s.find(';', start);
            const std::string pt =
                (sep == std::string::npos) ? s.substr(start) : s.substr(start, sep - start);
            start = (sep == std::string::npos) ? s.size() + 1 : sep + 1;
            if (pt.empty()) continue;

            const size_t comma = pt.find(',');
            if (comma == std::string::npos) { rejected++; continue; }

            const std::string xs = pt.substr(0, comma);
            const std::string ys = pt.substr(comma + 1);
            char *xend = nullptr;
            char *yend = nullptr;
            const float px = strtof(xs.c_str(), &xend);
            const float py = strtof(ys.c_str(), &yend);
            // endptr 未前进 = 完全没解析出数字；再挡掉 inf/nan。
            if (xend == xs.c_str() || yend == ys.c_str() ||
                !std::isfinite(px) || !std::isfinite(py)) {
              rejected++;
              continue;
            }

            id(radar).add_polygon_point(px, py);
            added++;
          }
          if (rejected > 0)
            ESP_LOGW("polygon", "Ignored %u malformed point(s) in polygon string", rejected);
          ESP_LOGI("polygon", "Applied %u polygon point(s)", added);

uart:
  id: uart_ld2451
  tx_pin: GPIO21   # ESP32-C3 TX -> LD2451 RX
  rx_pin: GPIO20   # ESP32-C3 RX <- LD2451 TX
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

globals:
  - id: g_radar_x
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_radar_y
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_radar_z
    type: float
    restore_value: true
    initial_value: "240.0"

  - id: g_yaw
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_pitch
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_roll
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_distance_min
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_distance_max
    type: float
    restore_value: true
    initial_value: "600.0"

  - id: g_polygon
    type: std::string
    restore_value: true
    max_restore_data_length: 254
    initial_value: '""'

ld2451:
  id: radar
  uart_id: uart_ld2451

  presence:
    name: "Presence"
    device_class: presence

  alarm:
    name: "Alarm"

  target_count:
    name: "Target Count"

  target_frame:
    name: "Target Frame"

  # ── 雷达自身配置回读（协议 1.2.4 / 1.2.6 / 1.2.7）────────────────────────
  # 发布的是雷达答复的值，而不是写进去的值：写失败时看得见。
  firmware_version:
    name: "Firmware Version"
  max_detection_distance:
    name: "Max Detection Distance"
  direction_filter:
    name: "Direction Filter"
  min_speed:
    name: "Min Speed"
  no_target_delay:
    name: "No Target Delay"
  trigger_count:
    name: "Trigger Count"
  snr_threshold:
    name: "SNR Threshold"

  target_1:
    distance:
      name: "Target 1 Distance"
    angle:
      name: "Target 1 Angle"
    speed:
      name: "Target 1 Speed"
    snr:
      name: "Target 1 SNR"
    x:
      name: "Target 1 X"
    y:
      name: "Target 1 Y"
    room_x:
      name: "Target 1 Room X"
    room_y:
      name: "Target 1 Room Y"
    room_z:
      name: "Target 1 Room Z"
    in_boundary:
      name: "Target 1 In Boundary"

  target_2:
    distance:
      name: "Target 2 Distance"
    angle:
      name: "Target 2 Angle"
    speed:
      name: "Target 2 Speed"
    snr:
      name: "Target 2 SNR"
    x:
      name: "Target 2 X"
    y:
      name: "Target 2 Y"
    room_x:
      name: "Target 2 Room X"
    room_y:
      name: "Target 2 Room Y"
    room_z:
      name: "Target 2 Room Z"
    in_boundary:
      name: "Target 2 In Boundary"

  target_3:
    distance:
      name: "Target 3 Distance"
    angle:
      name: "Target 3 Angle"
    speed:
      name: "Target 3 Speed"
    snr:
      name: "Target 3 SNR"
    x:
      name: "Target 3 X"
    y:
      name: "Target 3 Y"
    room_x:
      name: "Target 3 Room X"
    room_y:
      name: "Target 3 Room Y"
    room_z:
      name: "Target 3 Room Z"
    in_boundary:
      name: "Target 3 In Boundary"

number:
  - platform: template
    name: "Mount X"
    entity_category: config
    id: num_radar_x
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_x);"
    set_action:
      - lambda: |-
          id(g_radar_x) = x;
          id(radar).set_radar_x(x);
          id(num_radar_x).publish_state(x);

  - platform: template
    name: "Mount Y"
    entity_category: config
    id: num_radar_y
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_y);"
    set_action:
      - lambda: |-
          id(g_radar_y) = x;
          id(radar).set_radar_y(x);
          id(num_radar_y).publish_state(x);


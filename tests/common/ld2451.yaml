# LD2451 radar definition, shared by every consumer.
#
# Included by tests/ld2451-esp32c3.yaml (standalone firmware, and via
# that the factory build users flash) and by the workspace's
# esphome-config/ld2451-esp32c3.yaml. Edit here once.
#
# Carries no board, networking or external_components block on purpose:
# each consumer supplies its own, and two declarations of the same key
# would collide with no way to drop just one.

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(radar).set_radar_x(id(g_radar_x));
          id(radar).set_radar_y(id(g_radar_y));
          id(radar).set_radar_z(id(g_radar_z));
          id(radar).set_yaw(id(g_yaw));
          id(radar).set_pitch(id(g_pitch));
          id(radar).set_roll(id(g_roll));
          id(radar).set_distance_min(id(g_distance_min));
          id(radar).set_distance_max(id(g_distance_max));

uart:
  id: uart_ld2451
  tx_pin: GPIO21   # ESP32-C3 TX -> LD2451 RX
  rx_pin: GPIO20   # ESP32-C3 RX <- LD2451 TX
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

globals:
  - id: g_radar_x
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_radar_y
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_radar_z
    type: float
    restore_value: true
    initial_value: "240.0"

  - id: g_yaw
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_pitch
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_roll
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_distance_min
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_distance_max
    type: float
    restore_value: true
    initial_value: "600.0"

ld2451:
  id: radar
  uart_id: uart_ld2451

  presence:
    name: "presence"
    device_class: presence

  alarm:
    name: "alarm"

  target_count:
    name: "target_count"

  target_frame:
    name: "target_frame"

  target_1:
    distance:
      name: "target_1_distance"
    angle:
      name: "target_1_angle"
    speed:
      name: "target_1_speed"
    snr:
      name: "target_1_snr"
    x:
      name: "target_1_x"
    y:
      name: "target_1_y"
    room_x:
      name: "target_1_room_x"
    room_y:
      name: "target_1_room_y"
    room_z:
      name: "target_1_room_z"
    in_boundary:
      name: "target_1_in_boundary"

  target_2:
    distance:
      name: "target_2_distance"
    angle:
      name: "target_2_angle"
    speed:
      name: "target_2_speed"
    snr:
      name: "target_2_snr"
    x:
      name: "target_2_x"
    y:
      name: "target_2_y"
    room_x:
      name: "target_2_room_x"
    room_y:
      name: "target_2_room_y"
    room_z:
      name: "target_2_room_z"
    in_boundary:
      name: "target_2_in_boundary"

  target_3:
    distance:
      name: "target_3_distance"
    angle:
      name: "target_3_angle"
    speed:
      name: "target_3_speed"
    snr:
      name: "target_3_snr"
    x:
      name: "target_3_x"
    y:
      name: "target_3_y"
    room_x:
      name: "target_3_room_x"
    room_y:
      name: "target_3_room_y"
    room_z:
      name: "target_3_room_z"
    in_boundary:
      name: "target_3_in_boundary"

number:
  - platform: template
    name: "Radar X"
    id: num_radar_x
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_x);"
    set_action:
      - lambda: |-
          id(g_radar_x) = x;
          id(radar).set_radar_x(x);
          id(num_radar_x).publish_state(x);

  - platform: template
    name: "Radar Y"
    id: num_radar_y
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_y);"
    set_action:
      - lambda: |-
          id(g_radar_y) = x;
          id(radar).set_radar_y(x);
          id(num_radar_y).publish_state(x);

  - platform: template
    name: "Radar Z"
    id: num_radar_z
    unit_of_measurement: cm
    min_value: 50
    max_value: 400
    step: 1
    mode: box
    icon: mdi:ruler-square
    lambda: "return id(g_radar_z);"
    set_action:
      - lambda: |-
          id(g_radar_z) = x;
          id(radar).set_radar_z(x);
          id(num_radar_z).publish_state(x);

  - platform: template
    name: "Yaw"
    id: num_yaw
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 0.1
    mode: box
    icon: mdi:rotate-3d-variant
    lambda: "return id(g_yaw);"
    set_action:
      - lambda: |-
          id(g_yaw) = x;
          id(radar).set_yaw(x);
          id(num_yaw).publish_state(x);

  - platform: template
    name: "Pitch"
    id: num_pitch
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_pitch);"
    set_action:
      - lambda: |-
          id(g_pitch) = x;
          id(radar).set_pitch(x);
          id(num_pitch).publish_state(x);

  - platform: template
    name: "Roll"
    id: num_roll
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_roll);"
    set_action:
      - lambda: |-
          id(g_roll) = x;
          id(radar).set_roll(x);
          id(num_roll).publish_state(x);

  - platform: template
    name: "Distance Min"
    id: num_distance_min
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 5
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_min);"
    set_action:
      - lambda: |-
          id(g_distance_min) = x;
          id(radar).set_distance_min(x);
          id(num_distance_min).publish_state(x);

  - platform: template
    name: "Distance Max"
    id: num_distance_max
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 5
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_max);"
    set_action:
      - lambda: |-
          id(g_distance_max) = x;
          id(radar).set_distance_max(x);
          id(num_distance_max).publish_state(x);

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 60s

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "SSID"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

button:
  - platform: template
    name: "Factory Reset"
    id: btn_factory_reset
    icon: mdi:factory
    entity_category: config
    on_press:
      - lambda: 'id(radar).factory_reset();'

  - platform: template
    name: "Restart Module"
    id: btn_restart
    icon: mdi:restart
    entity_category: config
    on_press:
      - lambda: 'id(radar).restart_module();'

text:
  - platform: template
    name: "Mock Data"
    id: text_mock_data
    mode: text
    entity_category: diagnostic
    icon: mdi:bug
    optimistic: true
    set_action:
      - lambda: 'id(radar).inject_mock_data(x);'

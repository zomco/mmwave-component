# Lovelace 鍗＄墖鐐瑰嚮銆屼繚瀛樸€嶆椂锛屼細璋冪敤 number.set_value 鏈嶅姟鏇存柊杩欎簺瀹炰綋銆?
# set_action 灏嗗€煎啓鍏?globals 骞剁珛鍗虫洿鏂扮粍浠讹紝鏃犻渶閲嶅惎鍥轰欢銆?

number:
  - platform: template
    name: "Mount X"
    entity_category: config
    id: num_radar_x
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(radar).calibration().radar_x;"
    set_action:
      - lambda: |-
          if (id(host_link).submit_number("install.x_cm", x)) id(num_radar_x).publish_state(x);
          else id(num_radar_x).publish_state(id(radar).calibration().radar_x);

  - platform: template
    name: "Mount Y"
    entity_category: config
    id: num_radar_y
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(radar).calibration().radar_y;"
    set_action:
      - lambda: |-
          if (id(host_link).submit_number("install.y_cm", x)) id(num_radar_y).publish_state(x);
          else id(num_radar_y).publish_state(id(radar).calibration().radar_y);

  - platform: template
    name: "Mount Z"
    entity_category: config
    id: num_radar_z
    unit_of_measurement: cm
    min_value: 50
    max_value: 600
    step: 1
    mode: box
    icon: mdi:ruler-square
    lambda: "return id(radar).calibration().radar_z;"
    set_action:
      - lambda: |-
          if (id(host_link).submit_number("install.z_cm", x)) id(num_radar_z).publish_state(x);
          else id(num_radar_z).publish_state(id(radar).calibration().radar_z);

  - platform: template
    name: "Mount Yaw"

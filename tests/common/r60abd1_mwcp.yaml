# R60ABD1 core for the MWCP candidate and the host test profiles.
# Keep the radar entities aligned with r60abd1.yaml. This file includes
# _device.yaml without serial Improv, because native USB belongs to MWCP.
# Calibration writes go through host_link rather than straight to the radar.
#
# Included by tests/r60abd1-esp32c3.yaml and the host profiles.
# The workspace esphome-config stays on tests/common/r60abd1.yaml, which
# still has serial Improv. Do not point that production file here.
#
# Carries no board, networking or external_components block on purpose:
# each consumer supplies its own, and two declarations of the same key
# would collide with no way to drop just one.

# Diagnostics and recovery controls are the same on every model, so they live
# in one place rather than being copied into sixteen radar cores.
packages:
  device: !include _device.yaml
  areas: !include _areas_host.yaml

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // 寮€鏈哄惎鍔ㄥ悗锛屽皢淇濆瓨鍦ㄩ棯瀛樹腑鐨?globals 鎭㈠缁欏簳灞傞浄杈剧粍浠?
          id(radar).set_radar_x(id(g_radar_x));
          id(radar).set_radar_y(id(g_radar_y));
          id(radar).set_radar_z(id(g_radar_z));
          id(radar).set_yaw(id(g_yaw));
          id(radar).set_pitch(id(g_pitch));
          id(radar).set_roll(id(g_roll));

          if (!id(g_polygon).empty()) {
            id(text_polygon).publish_state(id(g_polygon));
          }
      - script.execute: apply_polygon

script:
  - id: apply_polygon
    mode: restart
    then:
      - lambda: |-
          // 瑙ｆ瀽 "x1,y1;x2,y2;..." 褰㈠紡鐨勫杈瑰舰瀛楃涓层€?
          //
          // 杩欓噷缁濅笉鑳界敤 std::stof銆侲SPHome 鐨?esp-idf 鏋勫缓鍏抽棴浜?C++ 寮傚父
          // (sdkconfig: CONFIG_COMPILER_CXX_EXCEPTIONS is not set)锛宻td::stof
          // 閬囧埌闈炴硶杈撳叆浼?std::terminate() -> abort()锛屼篃灏辨槸鐢ㄦ埛鍦?HA 鐨?
          // 鏂囨湰妗嗛噷闅忔墜鎵撻敊涓€涓瓧绗﹀氨浼氭妸闆疯揪閲嶅惎銆?
          //
          // 鏀圭敤 strtof + endptr 鏍￠獙锛氶潪娉曠殑鐐硅烦杩囧苟鍛婅锛屽叾浣欑収甯稿簲鐢ㄣ€?
          id(radar).clear_polygon();
          const std::string s = id(g_polygon);
          size_t start = 0;
          uint8_t added = 0;
          uint8_t rejected = 0;
          // 涓婇檺鍚屾椂闃蹭綇瓒呴暱杈撳叆鎾戠垎鍐呭瓨銆?
          while (start <= s.size() && added < 64) {
            const size_t sep = s.find(';', start);
            const std::string pt =
                (sep == std::string::npos) ? s.substr(start) : s.substr(start, sep - start);
            start = (sep == std::string::npos) ? s.size() + 1 : sep + 1;
            if (pt.empty()) continue;

            const size_t comma = pt.find(',');
            if (comma == std::string::npos) { rejected++; continue; }

            const std::string xs = pt.substr(0, comma);
            const std::string ys = pt.substr(comma + 1);
            char *xend = nullptr;
            char *yend = nullptr;
            const float px = strtof(xs.c_str(), &xend);
            const float py = strtof(ys.c_str(), &yend);
            // endptr 鏈墠杩?= 瀹屽叏娌¤В鏋愬嚭鏁板瓧锛涘啀鎸℃帀 inf/nan銆?
            if (xend == xs.c_str() || yend == ys.c_str() ||
                !std::isfinite(px) || !std::isfinite(py)) {
              rejected++;
              continue;
            }

            id(radar).add_polygon_point(px, py);
            added++;
          }
          if (rejected > 0)
            ESP_LOGW("polygon", "Ignored %u malformed point(s) in polygon string", rejected);
          ESP_LOGI("polygon", "Applied %u polygon point(s)", added);

# Reference the component from the submodule mount.

uart:
  id: uart_r60abd1
  tx_pin: GPIO21 # ESP32-C3 TX 鈫?R60ABD1 RXD锛堜氦鍙夋帴绾匡級
  rx_pin: GPIO20 # ESP32-C3 RX 鈫?R60ABD1 TXD
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

# =============================================================================
# 5. 鏍″噯鍙傛暟锛坓lobals锛?
# =============================================================================
# globals 鍦ㄨ繍琛屾椂鍙 number 瀹炰綋鐨?set_action 鏇存柊锛?
# 鐢ㄤ簬 component 鐨?set_*() 璋冪敤浠ュ疄鐜颁笉閲嶆柊缂栬瘧灏辫兘鏍″噯銆?

globals:
  - id: g_radar_x
    type: float
    restore_value: true # 鎺夌數鎭㈠锛岄伩鍏嶆瘡娆￠噸鍚兘瑕侀噸鏂版牎鍑?
    initial_value: "0.0" # 涓婄數榛樿鍊硷紝棣栨鐑у綍鍚庨€氳繃 number 瀹炰綋瑕嗙洊

  - id: g_radar_y
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_radar_z
    type: float
    restore_value: true
    initial_value: "220.0" # cm锛屽吀鍨嬪崸瀹ゅ惛椤跺畨瑁呴珮搴?

  - id: g_yaw
    type: float
    restore_value: true
    initial_value: "0.0" # 鐢?Lovelace 鍗＄墖涓ょ偣鍋忚埅鏍″噯鍚庢洿鏂?

  - id: g_pitch
    type: float
    restore_value: true
    initial_value: "0.0" # 姘村钩瀹夎涓?0锛涙枩瑁呮椂濉疄娴嬪€兼垨 IMU 璇绘暟

  - id: g_roll
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_polygon
    type: std::string
    restore_value: true
    max_restore_data_length: 254
    initial_value: '""'


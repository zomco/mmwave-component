    mode: box
    icon: mdi:rotate-3d-variant
    lambda: "return id(radar).calibration().yaw;"
    set_action:
      - lambda: |-
          if (id(host_link).submit_number("install.yaw_deg", x)) id(num_yaw).publish_state(x);
          else id(num_yaw).publish_state(id(radar).calibration().yaw);


# LD2411 radar definition, shared by every consumer.
#
# Included by tests/ld2411-esp32c3.yaml (standalone firmware, and via
# that the factory build users flash) and by the workspace's
# esphome-config/ld2411-esp32c3.yaml. Edit here once.
#
# Carries no board, networking or external_components block on purpose:
# each consumer supplies its own, and two declarations of the same key
# would collide with no way to drop just one.

# Diagnostics and recovery controls are the same on every model, so they live
# in one place rather than being copied into sixteen radar cores.
packages:
  device: !include _device.yaml

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // 开机后把闪存里的标定值恢复给底层组件。没有这一步，
          // Zone 距离闸门会在每次重启后归零，也就是静默失效。
          id(radar).set_yaw(id(g_yaw));
          id(radar).set_pitch(id(g_pitch));
          id(radar).set_roll(id(g_roll));
          id(radar).set_radar_x(id(g_radar_x));
          id(radar).set_radar_y(id(g_radar_y));
          id(radar).set_radar_z(id(g_radar_z));
          id(radar).set_distance_min(id(g_distance_min));
          id(radar).set_distance_max(id(g_distance_max));

globals:

  - id: g_yaw
    type: float
    restore_value: true
    initial_value: "0.0" # 偏航角

  - id: g_pitch
    type: float
    restore_value: true
    initial_value: "0.0" # 俯仰角

  - id: g_roll
    type: float
    restore_value: true
    initial_value: "0.0" # 横滚角

  - id: g_radar_x
    type: float
    restore_value: true
    initial_value: "0.0" # 雷达 X 位置（cm）

  - id: g_radar_y
    type: float
    restore_value: true
    initial_value: "0.0" # 雷达 Y 位置（cm）

  - id: g_radar_z
    type: float
    restore_value: true
    initial_value: "240.0"

  - id: g_distance_min
    type: float
    restore_value: true
    initial_value: "30.0" # 0 cm = 不设最小距离

  - id: g_distance_max
    type: float
    restore_value: true
    initial_value: "600.0" # 0 cm = 不设最大距离

uart:
  id: uart_ld2411
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

ld2411:
  id: radar
  uart_id: uart_ld2411
  
  radar_x: 0.0
  radar_y: 0.0
  radar_z: 240.0
  yaw: 0.0
  pitch: 0.0
  roll: 0.0
  presence:
    name: "Presence"
  distance:
    name: "Distance"
  motion_state:
    name: "Motion State"
  
  room_x:
    name: "Room X"
  room_y:
    name: "Room Y"
  room_z:
    name: "Room Z"
  in_boundary:
    name: "In Boundary"

number:
  - platform: template
    name: "Zone Min Distance"
    entity_category: config
    id: num_distance_min
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 10
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_min);"
    set_action:
      - lambda: |-
          id(g_distance_min) = x;
          id(radar).set_distance_min(x);
          id(num_distance_min).publish_state(x);

  - platform: template
    name: "Zone Max Distance"
    entity_category: config
    id: num_distance_max
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 10
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_max);"
    set_action:
      - lambda: |-
          id(g_distance_max) = x;
          id(radar).set_distance_max(x);
          id(num_distance_max).publish_state(x);

  - platform: template
    name: "Mount Yaw"
    entity_category: config
    id: num_yaw
    unit_of_measurement: °
    min_value: -180
    max_value: 180
    step: 0.1
    mode: box
    icon: mdi:compass
    lambda: "return id(g_yaw);"
    set_action:
      - lambda: |-
          id(g_yaw) = x;
          id(radar).set_yaw(x);
          id(num_yaw).publish_state(x);

  - platform: template
    name: "Mount Pitch"
    entity_category: config
    id: num_pitch
    unit_of_measurement: °
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_pitch);"
    set_action:
      - lambda: |-
          id(g_pitch) = x;
          id(radar).set_pitch(x);
          id(num_pitch).publish_state(x);

  - platform: template
    name: "Mount Roll"
    entity_category: config
    id: num_roll
    unit_of_measurement: °
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:axis-z-rotate-clockwise
    lambda: "return id(g_roll);"
    set_action:
      - lambda: |-
          id(g_roll) = x;
          id(radar).set_roll(x);
          id(num_roll).publish_state(x);

  - platform: template
    name: "Mount X"
    entity_category: config
    id: num_radar_x
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_x);"
    set_action:
      - lambda: |-
          id(g_radar_x) = x;
          id(radar).set_radar_x(x);
          id(num_radar_x).publish_state(x);

  - platform: template
    name: "Mount Y"
    entity_category: config
    id: num_radar_y
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_y);"
    set_action:
      - lambda: |-
          id(g_radar_y) = x;
          id(radar).set_radar_y(x);
          id(num_radar_y).publish_state(x);

  - platform: template
    name: "Mount Z"
    entity_category: config
    id: num_radar_z
    unit_of_measurement: cm
    min_value: 0
    max_value: 500
    step: 1
    mode: box
    icon: mdi:arrow-up-down
    lambda: "return id(g_radar_z);"
    set_action:
      - lambda: |-
          id(g_radar_z) = x;
          id(radar).set_radar_z(x);
          id(num_radar_z).publish_state(x);

# =============================================================================
# 诊断
# =============================================================================
#
# 名称写 "Mock Data" 而不是带型号前缀的形式：Home Assistant 已经会加设备名。
# 用 set_action 而不是 on_value——on_value 只在值*变化*时触发，同一帧连续注入
# 两次时第二次会被静默丢弃。

text:
  - platform: template
    name: "Mock Data"
    id: text_mock_data
    mode: text
    optimistic: true
    entity_category: diagnostic
    icon: mdi:bug
    set_action:
      - lambda: 'id(radar).inject_mock_data(x);'


# LD2420 radar definition, shared by every consumer.
#
# Included by tests/ld2420-esp32c3.yaml (standalone firmware, and via
# that the factory build users flash) and by the workspace's
# esphome-config/ld2420-esp32c3.yaml. Edit here once.
#
# Carries no board, networking or external_components block on purpose:
# each consumer supplies its own, and two declarations of the same key
# would collide with no way to drop just one.

# Diagnostics and recovery controls are the same on every model, so they live
# in one place rather than being copied into sixteen radar cores.
packages:
  device: !include _device.yaml

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // 开机启动后，将保存在闪存中的 globals 恢复给底层雷达组件
          id(radar).set_radar_x(id(g_radar_x));
          id(radar).set_radar_y(id(g_radar_y));
          id(radar).set_radar_z(id(g_radar_z));
          id(radar).set_yaw(id(g_yaw));
          id(radar).set_pitch(id(g_pitch));
          id(radar).set_roll(id(g_roll));
          id(radar).set_distance_min(id(g_distance_min));
          id(radar).set_distance_max(id(g_distance_max));

uart:
  id: uart_ld2420
  tx_pin: GPIO21   # ESP32-C3 → LD2420 RX（交叉接线）
  rx_pin: GPIO20   # ESP32-C3 ← LD2420 TX
  baud_rate: 115200
  # baud_rate: 256000
  data_bits: 8
  parity: NONE
  stop_bits: 1

# =============================================================================
# 校准参数（globals）持久化
# =============================================================================

globals:
  - id: g_radar_x
    type: float
    restore_value: true # 掉电恢复，避免每次重启都要重新校准
    initial_value: "0.0" # 上电默认值，首次烧录后通过 number 实体覆盖

  - id: g_radar_y
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_radar_z
    type: float
    restore_value: true
    initial_value: "240.0" # LD2420 推荐吸顶高度 2.4m

  - id: g_yaw
    type: float
    restore_value: true
    initial_value: "0.0" # 由 Lovelace 卡片校准后更新

  - id: g_pitch
    type: float
    restore_value: true
    initial_value: "0.0" # 水平安装为 0；斜装时填实测值或 IMU 读数

  - id: g_roll
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_distance_min
    type: float
    restore_value: true
    initial_value: "30.0" # 30 cm 最小距离盲区

  - id: g_distance_max
    type: float
    restore_value: true
    initial_value: "600.0" # 600 cm 最大有效距离

# =============================================================================
# LD2420 组件定义
# =============================================================================

ld2420:
  id: radar
  uart_id: uart_ld2420

  # ── 存在探测与距离 ────────────────────────────────────────────────────
  presence:
    name: "Presence"
    device_class: presence
  distance:
    name: "Distance"
    unit_of_measurement: "cm"

  # ── 坐标转换与区域过滤 ────────────────────────────────────────────────
  room_x:
    name: "Room X"
    unit_of_measurement: "cm"
  room_y:
    name: "Room Y"
    unit_of_measurement: "cm"
  room_z:
    name: "Room Z"
    unit_of_measurement: "cm"
  in_boundary:
    name: "In Boundary"

# =============================================================================
# 运行时校准控制实体 (number)
# =============================================================================

  # carried over from the component config
  radar_x: 0.0
  # carried over from the component config
  radar_y: 0.0
  # carried over from the component config
  radar_z: 240.0
  # carried over from the component config
  yaw: 0.0
  # carried over from the component config
  pitch: 0.0
  # carried over from the component config
  roll: 0.0
  # carried over from the component config
  distance_min: 30.0
  # carried over from the component config
  distance_max: 600.0

  # ── 存在探测与距离 ────────────────────────────────────────────────────

number:
  - platform: template
    name: "Radar X"
    entity_category: config
    id: num_radar_x
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_x);"
    set_action:
      - lambda: |-
          id(g_radar_x) = x;
          id(radar).set_radar_x(x);
          id(num_radar_x).publish_state(x);

  - platform: template
    name: "Radar Y"
    entity_category: config
    id: num_radar_y
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_y);"
    set_action:
      - lambda: |-
          id(g_radar_y) = x;
          id(radar).set_radar_y(x);
          id(num_radar_y).publish_state(x);

  - platform: template
    name: "Radar Z"
    entity_category: config
    id: num_radar_z
    unit_of_measurement: cm
    min_value: 50
    max_value: 400
    step: 1
    mode: box
    icon: mdi:ruler-square
    lambda: "return id(g_radar_z);"
    set_action:
      - lambda: |-
          id(g_radar_z) = x;
          id(radar).set_radar_z(x);
          id(num_radar_z).publish_state(x);

  - platform: template
    name: "Yaw"
    entity_category: config
    id: num_yaw
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 0.1
    mode: box
    icon: mdi:rotate-3d-variant
    lambda: "return id(g_yaw);"
    set_action:
      - lambda: |-
          id(g_yaw) = x;
          id(radar).set_yaw(x);
          id(num_yaw).publish_state(x);

  - platform: template
    name: "Pitch"
    entity_category: config
    id: num_pitch
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_pitch);"
    set_action:
      - lambda: |-
          id(g_pitch) = x;
          id(radar).set_pitch(x);
          id(num_pitch).publish_state(x);

  - platform: template
    name: "Roll"
    entity_category: config
    id: num_roll
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_roll);"
    set_action:
      - lambda: |-
          id(g_roll) = x;
          id(radar).set_roll(x);
          id(num_roll).publish_state(x);

  - platform: template
    name: "Min Distance"
    entity_category: config
    id: num_distance_min
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 10
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_min);"
    set_action:
      - lambda: |-
          id(g_distance_min) = x;
          id(radar).set_distance_min(x);
          id(num_distance_min).publish_state(x);

  - platform: template
    name: "Max Distance"
    entity_category: config
    id: num_distance_max
    unit_of_measurement: cm
    min_value: 0
    max_value: 1000
    step: 10
    mode: box
    icon: mdi:ruler
    lambda: "return id(g_distance_max);"
    set_action:
      - lambda: |-
          id(g_distance_max) = x;
          id(radar).set_distance_max(x);
          id(num_distance_max).publish_state(x);

# =============================================================================
# 基础状态与诊断传感器
# =============================================================================

# =============================================================================
# 模组控制
# =============================================================================
#
# restart_module_action() 和 factory_reset_action() 一直是公开方法，但没有任何
# YAML 把它们接出来，所以协议支持的两个动作在 Home Assistant 里都不存在。
#
# 走 template button 直接调用公开方法，与 ld2410b/ld2410c/ld2450/ld245x 一致。
# 组件里另有 set_restart_module_button()/set_factory_reset_button()，但 codegen
# 从未声明对应的配置键，接它们还要先加 schema——同样的效果，多一层。
#
# 这里不暴露 auto_calibrate_sensitivity()：它由 OP_CALIBRATE_MODE 在数据回调里
# 连续驱动，脱离该模式单独触发只会拿全零的采样算出错误的灵敏度。

button:
  - platform: template
    name: "Restart Module"
    id: btn_restart_module
    icon: mdi:restart
    entity_category: config
    on_press:
      - lambda: 'id(radar).restart_module_action();'

  - platform: template
    name: "Factory Reset"
    id: btn_factory_reset
    icon: mdi:factory
    entity_category: config
    on_press:
      - lambda: 'id(radar).factory_reset_action();'

text:
  - platform: template
    name: "Mock Data"
    id: text_mock_data
    mode: text
    optimistic: true
    entity_category: diagnostic
    icon: mdi:bug
    # set_action, not on_value: on_value only fires when the value *changes*, so
    # replaying the same frame twice would silently do nothing the second time.
    set_action:
      - lambda: 'id(radar).inject_mock_data(x);'


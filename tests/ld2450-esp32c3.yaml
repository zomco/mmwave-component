substitutions:
  name: ld2450
  friendly_name: "LD2450 Radar"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // 开机启动后，将保存在闪存中的 globals 恢复给底层雷达组件
          id(radar).set_radar_x(id(g_radar_x));
          id(radar).set_radar_y(id(g_radar_y));
          id(radar).set_radar_z(id(g_radar_z));
          id(radar).set_yaw(id(g_yaw));
          id(radar).set_pitch(id(g_pitch));
          id(radar).set_roll(id(g_roll));

          if (!id(g_polygon).empty()) {
            id(text_polygon).publish_state(id(g_polygon));
          }
      - script.execute: apply_polygon

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# ── 外部组件（本地路径） ──────────────────────────────────────────────────────
external_components:
  - source:
      type: local
      path: ../components
    components: [ld2450]

# ── 基础配置 ──────────────────────────────────────────────────────────────────
logger:

api:

ota:
  platform: esphome

wifi:
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

# =============================================================================
# 脚本与 UART
# =============================================================================

script:
  - id: apply_polygon
    mode: restart
    then:
      - lambda: |-
          // 解析 "x1,y1;x2,y2;..." 形式的多边形字符串。
          //
          // 这里绝不能用 std::stof。ESPHome 的 esp-idf 构建关闭了 C++ 异常
          // (sdkconfig: CONFIG_COMPILER_CXX_EXCEPTIONS is not set)，std::stof
          // 遇到非法输入会 std::terminate() -> abort()，也就是用户在 HA 的
          // 文本框里随手打错一个字符就会把雷达重启。
          //
          // 改用 strtof + endptr 校验：非法的点跳过并告警，其余照常应用。
          id(radar).clear_polygon();
          const std::string s = id(g_polygon);
          size_t start = 0;
          uint8_t added = 0;
          uint8_t rejected = 0;
          // 上限同时防住超长输入撑爆内存。
          while (start <= s.size() && added < 64) {
            const size_t sep = s.find(';', start);
            const std::string pt =
                (sep == std::string::npos) ? s.substr(start) : s.substr(start, sep - start);
            start = (sep == std::string::npos) ? s.size() + 1 : sep + 1;
            if (pt.empty()) continue;

            const size_t comma = pt.find(',');
            if (comma == std::string::npos) { rejected++; continue; }

            const std::string xs = pt.substr(0, comma);
            const std::string ys = pt.substr(comma + 1);
            char *xend = nullptr;
            char *yend = nullptr;
            const float px = strtof(xs.c_str(), &xend);
            const float py = strtof(ys.c_str(), &yend);
            // endptr 未前进 = 完全没解析出数字；再挡掉 inf/nan。
            if (xend == xs.c_str() || yend == ys.c_str() ||
                !std::isfinite(px) || !std::isfinite(py)) {
              rejected++;
              continue;
            }

            id(radar).add_polygon_point(px, py);
            added++;
          }
          if (rejected > 0)
            ESP_LOGW("polygon", "Ignored %u malformed point(s) in polygon string", rejected);
          ESP_LOGI("polygon", "Applied %u polygon point(s)", added);

# ── UART（LD2450 默认波特率 256000，8N1） ─────────────────────────────────────
uart:
  id: uart_ld2450
  tx_pin: GPIO21   # ESP32-C3 → LD2450 RX（交叉接线）
  rx_pin: GPIO20   # ESP32-C3 ← LD2450 TX
  baud_rate: 256000
  data_bits: 8
  parity: NONE
  stop_bits: 1

# =============================================================================
# 校准参数（globals）
# =============================================================================
# globals 在运行时可被 number 实体的 set_action 更新，
# 用于 component 的 set_*() 调用以实现不重新编译就能校准。

globals:
  - id: g_radar_x
    type: float
    restore_value: true # 掉电恢复，避免每次重启都要重新校准
    initial_value: "0.0" # 上电默认值，首次烧录后通过 number 实体覆盖

  - id: g_radar_y
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_radar_z
    type: float
    restore_value: true
    initial_value: "150.0" # LD2450 推荐高度

  - id: g_yaw
    type: float
    restore_value: true
    initial_value: "0.0" # 由 Lovelace 卡片两点偏航校准后更新

  - id: g_pitch
    type: float
    restore_value: true
    initial_value: "0.0" # 水平安装为 0；斜装时填实测值或 IMU 读数

  - id: g_roll
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: g_polygon
    type: std::string
    restore_value: true
    max_restore_data_length: 254
    initial_value: '""'

# ── LD2450 组件 ───────────────────────────────────────────────────────────────
ld2450:
  id: radar
  uart_id: uart_ld2450

  # ── 编译期校准参数（初始值；运行时可被 number 实体覆盖）─────────────────
  # 说明：组件 setup() 时用这些值初始化；number 实体 set_action 之后调用
  # id(radar).set_yaw(x) 实时更新，无需重启。
  radar_x: 0.0 # 雷达在房间中的 X 位置（cm，房间左下角为原点）
  radar_y: 0.0 # Y 位置（cm）
  radar_z: 150.0 # 安装高度（cm）
  yaw: 0.0 # 偏航角（°，由校准卡片填写）
  pitch: 0.0 # 俯仰角（°）
  roll: 0.0 # 横滚角（°）

  # ── 全局存在检测 ─────────────────────────────────────────────────────────
  presence:
    name: "presence"
    device_class: presence

  # ── 多雷达融合入口：10 Hz 原子目标帧（mmwave_fusion 的 frame_entity）──────
  target_frame:
    name: "target_frame"
    icon: mdi:radar

  # ── 雷达原生区域过滤（协议 2.2.12/2.2.13，配置掉电不丢失）──────────────
  # type: disabled | include（仅检测区域内）| exclude（忽略区域内）
  # 坐标为矩形对角两顶点，单位 cm（下发时转 mm）
  zone_filter:
    type: exclude
    zones:
      - { x1: -100.0, y1: 100.0, x2: 100.0, y2: 500.0 }

  # ── 控制实体（CI 需覆盖这些 codegen 路径）──────────────────────────────
  multi_target:
    name: "multi_target"
  bluetooth:
    name: "bluetooth"
  restart:
    name: "restart"
  factory_reset:
    name: "factory_reset"

  # ── 目标 1 ──────────────────────────────────────────────────────────────
  target_1_x:
    name: "target_1_x"
  target_1_y:
    name: "target_1_y"
  target_1_speed:
    name: "target_1_speed"
  target_1_resolution:
    name: "target_1_resolution"
    internal: true
  target_1_distance:
    name: "target_1_distance"
  target_1_angle:
    name: "target_1_angle"
  target_1_room_x:
    name: "target_1_room_x"
  target_1_room_y:
    name: "target_1_room_y"
  target_1_active:
    name: "target_1_active"
  target_1_in_boundary:
    name: "target_1_in_boundary"

  # ── 目标 2 ──────────────────────────────────────────────────────────────
  target_2_x:
    name: "target_2_x"
  target_2_y:
    name: "target_2_y"
  target_2_speed:
    name: "target_2_speed"
  target_2_resolution:
    name: "target_2_resolution"
    internal: true
  target_2_distance:
    name: "target_2_distance"
  target_2_angle:
    name: "target_2_angle"
  target_2_room_x:
    name: "target_2_room_x"
  target_2_room_y:
    name: "target_2_room_y"
  target_2_active:
    name: "target_2_active"
  target_2_in_boundary:
    name: "target_2_in_boundary"

  # ── 目标 3 ──────────────────────────────────────────────────────────────
  target_3_x:
    name: "target_3_x"
  target_3_y:
    name: "target_3_y"
  target_3_speed:
    name: "target_3_speed"
  target_3_resolution:
    name: "target_3_resolution"
    internal: true
  target_3_distance:
    name: "target_3_distance"
  target_3_angle:
    name: "target_3_angle"
  target_3_room_x:
    name: "target_3_room_x"
  target_3_room_y:
    name: "target_3_room_y"
  target_3_active:
    name: "target_3_active"
  target_3_in_boundary:
    name: "target_3_in_boundary"

# =============================================================================
# Number 实体（接收 Lovelace 卡片或 HA 自动化写入的校准参数）
# =============================================================================
# Lovelace 卡片点击「保存」时，会调用 number.set_value 服务更新这些实体。
# set_action 将值写入 globals 并立即更新组件，无需重启固件。

number:
  - platform: template
    name: "Radar X"
    id: num_radar_x
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_x);"
    set_action:
      - lambda: |-
          id(g_radar_x) = x;
          id(radar).set_radar_x(x);

  - platform: template
    name: "Radar Y"
    id: num_radar_y
    unit_of_measurement: cm
    min_value: -2000
    max_value: 2000
    step: 1
    mode: box
    icon: mdi:crosshairs-gps
    lambda: "return id(g_radar_y);"
    set_action:
      - lambda: |-
          id(g_radar_y) = x;
          id(radar).set_radar_y(x);

  - platform: template
    name: "Radar Z"
    id: num_radar_z
    unit_of_measurement: cm
    min_value: 50
    max_value: 400
    step: 1
    mode: box
    icon: mdi:ruler-square
    lambda: "return id(g_radar_z);"
    set_action:
      - lambda: |-
          id(g_radar_z) = x;
          id(radar).set_radar_z(x);

  - platform: template
    name: "Yaw"
    id: num_yaw
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 0.1
    mode: box
    icon: mdi:rotate-3d-variant
    lambda: "return id(g_yaw);"
    set_action:
      - lambda: |-
          id(g_yaw) = x;
          id(radar).set_yaw(x);

  - platform: template
    name: "Pitch"
    id: num_pitch
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_pitch);"
    set_action:
      - lambda: |-
          id(g_pitch) = x;
          id(radar).set_pitch(x);

  - platform: template
    name: "Roll"
    id: num_roll
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.5
    mode: box
    icon: mdi:angle-acute
    lambda: "return id(g_roll);"
    set_action:
      - lambda: |-
          id(g_roll) = x;
          id(radar).set_roll(x);

# ── 可选：WiFi 信号强度 ───────────────────────────────────────────────────────
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

# ── 可选：命令按钮 ────────────────────────────────────────────────────────────
button:
  - platform: template
    name: "restart_radar"
    on_press:
      lambda: "id(radar).restart_module();"

# =============================================================================
# Text 实体（接收 Lovelace 卡片下发的多边形字符串）
# =============================================================================

text:
  - platform: template
    name: "Polygon Config"
    id: text_polygon
    min_length: 0
    max_length: 255
    optimistic: true
    mode: text
    icon: mdi:vector-polygon
    set_action:
      - lambda: |-
          id(g_polygon) = x;
      - script.execute: apply_polygon

  - platform: template
    name: "Mock Data"
    id: text_mock_data
    min_length: 0
    max_length: 255
    optimistic: true
    mode: text
    icon: mdi:code-json
    set_action:
      - lambda: |-
          id(radar).inject_mock_data(x);

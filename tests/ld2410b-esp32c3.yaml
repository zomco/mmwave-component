esphome:
  name: ld2410b
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components

logger:

uart:
  id: uart_bus
  tx_pin: GPIO4
  rx_pin: GPIO5
  baud_rate: 256000

number:
  - platform: template
    name: "Radar Yaw"
    id: radar_yaw
    min_value: -180
    max_value: 180
    step: 1
    initial_value: 0
    optimistic: true
  - platform: template
    name: "Radar Pitch"
    id: radar_pitch
    min_value: -90
    max_value: 90
    step: 1
    initial_value: 0
    optimistic: true

ld2410b:
  id: my_radar
  uart_id: uart_bus
  
  radar_x: 0.0
  radar_y: 0.0
  radar_z: 240.0
  yaw: 0.0
  pitch: 0.0
  roll: 0.0
  
  distance_min: 0.0
  distance_max: 300.0

  presence:
    name: "Presence"
  target_state:
    name: "Target State"
  moving_distance:
    name: "Moving Distance"
  moving_energy:
    name: "Moving Energy"
  stationary_distance:
    name: "Stationary Distance"
  stationary_energy:
    name: "Stationary Energy"
  detection_distance:
    name: "Detection Distance"
  
  room_x:
    name: "Room X"
  room_y:
    name: "Room Y"
  room_z:
    name: "Room Z"
  in_boundary:
    name: "In Boundary"

api:

ota:
  platform: esphome

wifi:
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

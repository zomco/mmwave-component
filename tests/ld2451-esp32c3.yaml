substitutions:
  name: ld2451
  friendly_name: "Radar"
esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components: [ld2451]

logger:

api:

ota:
  platform: esphome

wifi:
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

uart:
  id: uart_ld2451
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

ld2451:
  id: radar
  uart_id: uart_ld2451
  
  radar_x: 0.0
  radar_y: 0.0
  radar_z: 240.0
  yaw: 0.0
  pitch: 0.0
  roll: 0.0
  distance_min: 30.0
  distance_max: 600.0

  presence:
    name: "Presence"
  target_count:
    name: "Target Count"
  alarm:
    name: "Alarm"

  target_1:
    distance:
      name: "Target 1 Distance"
    angle:
      name: "Target 1 Angle"
    speed:
      name: "Target 1 Speed"
    snr:
      name: "Target 1 SNR"
    x:
      name: "Target 1 X"
    y:
      name: "Target 1 Y"
    room_x:
      name: "Target 1 Room X"
    room_y:
      name: "Target 1 Room Y"
    room_z:
      name: "Target 1 Room Z"
    in_boundary:
      name: "Target 1 In Boundary"

  target_2:
    distance:
      name: "Target 2 Distance"
    angle:
      name: "Target 2 Angle"
    speed:
      name: "Target 2 Speed"
    snr:
      name: "Target 2 SNR"
    x:
      name: "Target 2 X"
    y:
      name: "Target 2 Y"
    room_x:
      name: "Target 2 Room X"
    room_y:
      name: "Target 2 Room Y"
    room_z:
      name: "Target 2 Room Z"
    in_boundary:
      name: "Target 2 In Boundary"

  target_3:
    distance:
      name: "Target 3 Distance"
    angle:
      name: "Target 3 Angle"
    speed:
      name: "Target 3 Speed"
    snr:
      name: "Target 3 SNR"
    x:
      name: "Target 3 X"
    y:
      name: "Target 3 Y"
    room_x:
      name: "Target 3 Room X"
    room_y:
      name: "Target 3 Room Y"
    room_z:
      name: "Target 3 Room Z"
    in_boundary:
      name: "Target 3 In Boundary"

number:
  - platform: template
    name: "yaw"
    min_value: -180
    max_value:  180
    step: 0.1
    set_action:
      lambda: "id(radar).set_yaw(x);"

  - platform: template
    name: "pitch"
    min_value: -90
    max_value:  90
    step: 0.5
    set_action:
      lambda: "id(radar).set_pitch(x);"

  - platform: template
    name: "roll"
    min_value: -90
    max_value:  90
    step: 0.5
    set_action:
      lambda: "id(radar).set_roll(x);"

  - platform: template
    name: "radar_x"
    min_value: -2000
    max_value:  2000
    step: 1
    set_action:
      lambda: "id(radar).set_radar_x(x);"

  - platform: template
    name: "radar_y"
    min_value: -2000
    max_value:  2000
    step: 1
    set_action:
      lambda: "id(radar).set_radar_y(x);"

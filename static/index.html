    const LanguageContext = React.createContext();
    const LanguageProvider = ({ children }) => {
      const [lang, setLang] = useState(() => localStorage.getItem('appLang') || 'en');
      useEffect(() => { localStorage.setItem('appLang', lang); }, [lang]);
      const t = (key, params = {}) => {
        let str = translations[lang][key] || key;
        for (const [k, v] of Object.entries(params)) {
          str = str.replace(`{${k}}`, v);
        }
        return str;
      };
      const toggleLang = () => setLang(l => l === 'zh' ? 'en' : 'zh');
      return (
        <LanguageContext.Provider value={{ lang, toggleLang, t }}>
          {children}
        </LanguageContext.Provider>
      );
    };
    
    const ThemeContext = React.createContext();
    const ThemeProvider = ({ children }) => {
      const [theme, setTheme] = useState(() => localStorage.getItem('appTheme') || 'dark');
      
      useEffect(() => {
        localStorage.setItem('appTheme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [theme]);
      
      const toggleTheme = () => setTheme(t => t === 'dark' ? 'light' : 'dark');
      
      return (
        <ThemeContext.Provider value={{ theme, toggleTheme }}>
          {children}
        </ThemeContext.Provider>
      );
    };

      if (s.includes('ld2410')) return 'ld2410';
      if (s.includes('ld2411')) return 'ld2411';
      if (s.includes('ld2420')) return 'ld2420';
      if (s.includes('ld2450')) return 'ld2450';
      if (s.includes('ld2451')) return 'ld2451';
      if (s.includes('ld2453')) return 'ld2453';
      if (s.includes('ld6002')) return 'ld6002';
      if (s.includes('rd03e')) return 'rd03e';
      if (s.includes('r60abd1')) return 'r60abd1';
      return 'generic';
    };

    const getRadarConfig = (radarType) => {
      if (RADAR_CONFIG[radarType]) return RADAR_CONFIG[radarType];
      // Generic default radar (15x30mm)
      return {
        width: 15, height: 30,
        pins: [
          { name: 'VCC', x: 7.5, y: 22, type: 'vcc' },
          { name: 'GND', x: 7.5, y: 24.54, type: 'gnd' },
          { name: 'TX', x: 7.5, y: 27.08, type: 'tx' },
          { name: 'RX', x: 7.5, y: 29.62, type: 'rx' }
        ]
      };
    };

    const DynamicWiringDiagram = ({ model }) => {
      const scale = 8; // 1mm = 8px
      const espWidth = 18 * scale;
      const espHeight = 22.5 * scale;
      const espX = 50;
      const espY = 50;
      
      // Robustly extract the radar type string from the varied JSON fields
      const typeStr = (model.radar_model || model.name || model.id || '').toLowerCase();
      const radarType = getRadarType(typeStr);
      const radarConfig = getRadarConfig(radarType);
      
      const radarWidth = radarConfig.width * scale;
      const radarHeight = radarConfig.height * scale;
      const radarX = 400;
      const radarY = 50;

      // ESP32-C3 Supermini Pin mappings (front view: 5V is Top-Right, 21 is Bottom-Left)
      const espPins = {
        '5V': { x: espWidth, y: 20, color: '#ef4444', labelX: espWidth - 25 },
        'GND': { x: espWidth, y: 40, color: '#22c55e', labelX: espWidth - 25 },
        '3V3': { x: espWidth, y: 60, color: '#b91c1c', labelX: espWidth - 25 },
        'RX': { x: 0, y: 140, color: '#06b6d4', labelX: 30, label: '20(RX)' },
        'TX': { x: 0, y: 160, color: '#f59e0b', labelX: 30, label: '21(TX)' }
      };

      // Generate wires
      const wires = [];
      const radarPinsRender = radarConfig.pins.map((pin, i) => {
        const absX = radarX + pin.x * scale;
        const absY = radarY + pin.y * scale;
        
        let targetEspPin = null;
        if (pin.type === 'vcc') targetEspPin = espPins['5V'];
        if (pin.type === 'gnd') targetEspPin = espPins['GND'];
        if (pin.type === 'rx') targetEspPin = espPins['TX']; // Radar RX connects to ESP TX
        if (pin.type === 'tx') targetEspPin = espPins['RX']; // Radar TX connects to ESP RX

        if (targetEspPin) {
          const startX = espX + targetEspPin.x;
          const startY = espY + targetEspPin.y;
          
          const isEspLeft = targetEspPin.x === 0;
          const isRadarLeft = (pin.x * scale) < (radarWidth / 2);
          
          const espDropX = startX + (isEspLeft ? -20 - i*6 : 20 + i*6);
          const radarDropX = absX + (isRadarLeft ? -20 - i*6 : 20 + i*6);
          const busY = Math.max(espY + espHeight, radarY + radarHeight) + 20 + (i * 8);

          const points = [
            `${startX},${startY}`,
            `${espDropX},${startY}`,
            `${espDropX},${busY}`,
            `${radarDropX},${busY}`,
            `${radarDropX},${absY}`,
            `${absX},${absY}`
          ];

          wires.push(
            <polyline 
              key={`wire-${i}`} 
              points={points.join(' ')} 
              fill="none" 
              stroke={targetEspPin.color} 
              strokeWidth="2.5" 
              strokeLinejoin="round"
              opacity="0.8" 
            />
          );
        }

        const isRadarLeft = (pin.x * scale) < (radarWidth / 2);
        return (
          <g key={`rpin-${i}`}>
            {targetEspPin && (
              <circle cx={absX} cy={absY} r="7" fill="none" stroke={targetEspPin.color} strokeWidth="2.5" opacity="0.8" />
            )}
            <circle cx={absX} cy={absY} r="4" fill={targetEspPin ? targetEspPin.color : "#fbbf24"} />

              x={absX + (pin.labelDx !== undefined ? pin.labelDx : (isRadarLeft ? 10 : -8))} 
              y={absY + (pin.labelDy !== undefined ? pin.labelDy : 3)} 
              textAnchor={pin.anchor || (isRadarLeft ? "start" : "end")} 
              fill={targetEspPin ? targetEspPin.color : "#94a3b8"} 
              fontSize={pin.fontSize || "10"} 
              fontWeight="bold"
            >
              {pin.name}
            </text>
          </g>
        );
      });

      // Calculate required width and height for SVG viewBox
      const maxBoardY = Math.max(espY + espHeight, radarY + radarHeight);
      const svgHeight = Math.max(300, maxBoardY + 100); 
      const svgWidth = radarX + radarWidth + 50;

      return (

            {/* Ceramic Antenna (Pink/Red at bottom) */}

    const AssemblyPreview = ({ model }) => {
      const containerRef = useRef(null);
      const [error, setError] = useState(null);

      useEffect(() => {
        if (!containerRef.current) return;
        
        if (!window.THREE) {
          setError("3D rendering engine not loaded.");
          return;
        }

        const width = containerRef.current.clientWidth;
        const height = containerRef.current.clientHeight || 400;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a); // slate-900

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, -100, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        containerRef.current.innerHTML = '';
        containerRef.current.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 50, 100);
        scene.add(dirLight);
        
        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight2.position.set(-50, -50, -50);
        scene.add(dirLight2);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        let loader;
        try {
          loader = new THREE.STLLoader();
        } catch (e) {
          setError("STLLoader not available.");
          return;
        }
        
        const stlUrl = `stls/${model.radar_model}_enclosure.stl`;
        let mesh = null;
        let isFallback = false;

        loader.load(
          stlUrl,
          (geometry) => {
            const material = new THREE.MeshPhongMaterial({ 
              color: 0x94a3b8, // slate-400
              specular: 0x111111, 
              shininess: 50 
            });
            
            mesh = new THREE.Mesh(geometry, material);
            
            geometry.computeBoundingBox();
            const boundingBox = geometry.boundingBox;
            const center = new THREE.Vector3();
            boundingBox.getCenter(center);
            
            mesh.position.x = -center.x;
            mesh.position.y = -center.y;
            mesh.position.z = -center.z;
            
            mesh.rotation.x = -Math.PI / 2;
            
            scene.add(mesh);
            setError(null);
            
            const maxDim = Math.max(
              boundingBox.max.x - boundingBox.min.x,
              boundingBox.max.y - boundingBox.min.y,
              boundingBox.max.z - boundingBox.min.z
            );
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 * Math.tan(fov * 2)) * 1.5;
            
            camera.position.set(0, -cameraZ, cameraZ);
            controls.update();
          },
          undefined,
          (err) => {
            console.error("Error loading STL:", err);
            setError(`STL file not found: ${stlUrl}`);
            isFallback = true;
            
            const geometry = new THREE.BoxGeometry(20, 20, 20);
            const material = new THREE.MeshPhongMaterial({ color: 0x10b981, wireframe: true });
            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);
            
            camera.position.set(0, 30, 50);
            controls.update();
          }
        );

        let animationFrameId;
        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          controls.update();
          
          if (mesh && isFallback) {
            mesh.rotation.x += 0.01;
            mesh.rotation.y += 0.01;
          }
          
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!containerRef.current) return;
          const w = containerRef.current.clientWidth;
          const h = containerRef.current.clientHeight || 400;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
          if (containerRef.current) {
            containerRef.current.innerHTML = '';
          }
          renderer.dispose();
        };
      }, [model]);

      return (
        <div className="relative w-full h-[400px] bg-slate-100 dark:bg-slate-900 rounded-xl overflow-hidden border border-slate-300 dark:border-slate-700 shadow-inner">
          <div ref={containerRef} className="w-full h-full cursor-move" />
          {error && (
            <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-100/80 dark:bg-slate-900/80 backdrop-blur-sm z-10 pointer-events-none">
              <BoxIcon className="w-12 h-12 text-slate-400 dark:text-slate-500 mb-4 opacity-50" />
              <p className="text-slate-600 dark:text-slate-400 font-medium text-center px-4">{error}</p>
              <p className="text-slate-500 text-sm mt-2 max-w-sm text-center">
                The 3D enclosure model for <strong>{model.name}</strong> hasn't been uploaded yet. Please check back later.
              </p>
            </div>
          )}
        </div>
      );
    };

              {/* Step 3 */}
              <div className="flex gap-4">
                <div className="flex-shrink-0 w-8 h-8 rounded-full bg-brand/10 dark:bg-brand/20 text-brand flex items-center justify-center font-bold border border-brand/30">3</div>
                <div className="w-full">
                  <h4 className="text-lg font-semibold text-slate-900 dark:text-white mb-1">{t('config_step3_title')}</h4>
                  <p className="text-slate-600 dark:text-slate-400 text-sm mb-4 leading-relaxed">{t('config_step3_desc')}</p>
                  
                  <div className="bg-slate-100 dark:bg-slate-800 p-5 rounded-lg border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                    <div>
                      <h5 className="font-semibold text-slate-900 dark:text-white flex items-center gap-2">
                        <MmwaveLogoIcon className="w-5 h-5 text-brand" />
                        {t('config_card_title')}
                      </h5>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">{t('config_card_desc')}</p>
                    </div>
                    <a 
                      href={hacsUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="inline-flex items-center gap-2 bg-brand hover:bg-brand-hover text-white px-4 py-2 rounded-lg text-sm font-semibold transition-all hover:shadow-lg hover:shadow-brand/20 flex-shrink-0"
                    >
                      <DownloadIcon className="w-4 h-4" />
                      {t('config_install_btn')}
                    </a>
                  </div>
                  <p className="text-xs text-slate-600 dark:text-slate-500 mt-3 bg-slate-100/50 dark:bg-slate-800/50 p-3 rounded border border-slate-200/50 dark:border-slate-700/50">
                    <AlertTriangleIcon className="w-4 h-4 inline-block mr-1 -mt-0.5" />
                    <span dangerouslySetInnerHTML={{__html: t('config_warning').replace('注意：', '<strong>$&</strong>').replace('空白的“您确定吗？”对话框', '<strong>$&</strong>').replace('\'Are you sure?\'', '<strong>$&</strong>').replace('https://github.com/zomco/mmwave-card', '<code class="text-slate-700 dark:text-slate-300">$&</code>').replace('仪表板 / 插件', '<code class="text-slate-700 dark:text-slate-300">$&</code>').replace('Dashboard / Plugin', '<code class="text-slate-700 dark:text-slate-300">$&</code>')}}></span>
                  </p>
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    };

    const WiringGuide = ({ model }) => {
      const { t } = React.useContext(LanguageContext);
      const [activeTab, setActiveTab] = useState('wiring');

      return (
        <div className="mt-8 border-t border-slate-200 dark:border-slate-700 pt-8 space-y-6">
          <div className="flex sm:justify-center border-b border-slate-200 dark:border-slate-700 mb-6 flex-nowrap overflow-x-auto scrollbar-hide">
            <button
              onClick={() => setActiveTab('wiring')}
              className={`flex items-center gap-2 px-6 py-3 font-semibold text-sm transition-colors relative whitespace-nowrap ${
                activeTab === 'wiring' ? 'text-brand' : 'text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200'
              }`}
            >
              <CpuIcon />
              {t('tab_wiring')}
              {activeTab === 'wiring' && (
                <span className="absolute bottom-[-1px] left-0 w-full h-0.5 bg-brand rounded-t-full"></span>
              )}
            </button>
            <button
              onClick={() => setActiveTab('assembly')}
              className={`flex items-center gap-2 px-6 py-3 font-semibold text-sm transition-colors relative whitespace-nowrap ${
                activeTab === 'assembly' ? 'text-brand' : 'text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200'
              }`}
            >
              <BoxIcon />
              {t('tab_assembly')}
              {activeTab === 'assembly' && (
                <span className="absolute bottom-[-1px] left-0 w-full h-0.5 bg-brand rounded-t-full"></span>
              )}
            </button>
            <button
              onClick={() => setActiveTab('config')}
              className={`flex items-center gap-2 px-6 py-3 font-semibold text-sm transition-colors relative whitespace-nowrap ${
                activeTab === 'config' ? 'text-brand' : 'text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200'
              }`}
            >
              <SettingsIcon />
              {t('tab_config')}
              {activeTab === 'config' && (
                <span className="absolute bottom-[-1px] left-0 w-full h-0.5 bg-brand rounded-t-full"></span>
              )}
            </button>
          </div>

          <div>
            {activeTab === 'wiring' ? (
              <div className="transition-opacity duration-300">
                <DynamicWiringDiagram model={model} />
                <p className="text-xs text-slate-500 mt-3 text-center" dangerouslySetInnerHTML={{__html: t('wiring_note', { radar: model.radar_model }).replace('tests/' + model.radar_model + '.yaml', '<code class="text-slate-400">tests/' + model.radar_model + '.yaml</code>')}}></p>
              </div>
            ) : activeTab === 'assembly' ? (
              <div className="transition-opacity duration-300">
                <AssemblyPreview model={model} />
                <p className="text-xs text-slate-500 mt-3 text-center">
                  {t('assembly_note')}
                </p>
              </div>
            ) : (
              <div className="transition-opacity duration-300">
                <ConfigGuide />
              </div>
            )}
          </div>
        </div>
      );
    }


    const App = () => {
      const { lang, toggleLang, t } = React.useContext(LanguageContext);
      const { theme, toggleTheme } = React.useContext(ThemeContext);
      const [models, setModels] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [isWebSerialSupported, setIsWebSerialSupported] = useState(true);

      const [selectedRadar, setSelectedRadar] = useState("");
      const [selectedVariantId, setSelectedVariantId] = useState("");

      useEffect(() => {
        setIsWebSerialSupported('serial' in navigator);
        
        fetch('models.json')
          .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
          })
          .then(data => {
            setModels(data);
            setLoading(false);
          })
          .catch(err => {
            console.error(err);
            setError(t('error_load'));
            setLoading(false);
          });
      }, []);

      // Group models by radar_model
      const radarModels = useMemo(() => {
        const unique = [...new Set(models.map(m => m.radar_model))];
        return unique.sort();
      }, [models]);

      // Get variants for selected radar
      const variants = useMemo(() => {
        if (!selectedRadar) return [];
        return models.filter(m => m.radar_model === selectedRadar);
      }, [models, selectedRadar]);

      const selectedModel = useMemo(() => {
        if (!selectedVariantId) return null;
        return models.find(m => m.id === selectedVariantId);
      }, [models, selectedVariantId]);

      // Reset variant when radar changes
      useEffect(() => {
        if (variants.length > 0) {
          setSelectedVariantId(variants[0].id);
        } else {
          setSelectedVariantId("");
        }
      }, [selectedRadar, variants]);

      const isStep2Enabled = !!selectedRadar;
      const isStep3Enabled = !!selectedVariantId;

      return (
        <div className="min-h-screen flex flex-col font-sans relative text-slate-900 dark:text-white transition-colors duration-300">
          {!isWebSerialSupported && (
            <div className="bg-amber-500 text-slate-900 text-center p-3 font-medium flex items-center justify-center gap-2">
              <AlertTriangleIcon />
              {t('unsupported')}
            </div>
          )}

          <header className="relative pt-20 pb-8 md:pt-12 md:pb-8 min-h-[200px] flex flex-col justify-center text-center bg-slate-100 dark:bg-bg-dark border-b border-slate-300 dark:border-slate-800 transition-colors duration-300">
            {/* Toggles */}
            <div className="absolute top-4 right-4 z-50 flex items-center gap-2">
              <button 
                onClick={toggleTheme}
                className="flex items-center justify-center w-8 h-8 bg-slate-200/80 hover:bg-slate-300 dark:bg-slate-800/80 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-full border border-slate-300 dark:border-slate-700 transition-colors shadow-lg backdrop-blur-sm"
                title="Toggle Theme"
              >
                {theme === 'dark' ? <SunIcon /> : <MoonIcon />}
              </button>
              <button 
                onClick={toggleLang}
                className="flex items-center gap-2 px-3 h-8 bg-slate-200/80 hover:bg-slate-300 dark:bg-slate-800/80 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold rounded-full border border-slate-300 dark:border-slate-700 transition-colors shadow-lg backdrop-blur-sm"
                title="Switch Language"
              >
                <GlobeIcon />
                {lang === 'zh' ? 'EN' : '中文'}
              </button>
            </div>

            <h1 className="text-2xl sm:text-3xl md:text-4xl font-bold text-slate-900 dark:text-white mb-3 flex flex-col sm:flex-row items-center justify-center gap-3 transition-colors duration-300">
              <MmwaveLogoIcon className="w-10 h-10 md:w-12 md:h-12 text-brand" />
              {t('title')}
            </h1>
            <p className="text-slate-600 dark:text-slate-400 max-w-2xl mx-auto px-4 text-sm md:text-base transition-colors duration-300">
              {t('subtitle')}
            </p>
          </header>

          <main className="flex-1 max-w-6xl w-full mx-auto p-4 md:p-8">
            {loading && <p className="text-center text-slate-500 dark:text-slate-400 animate-pulse py-12">{t('loading')}</p>}
            {error && <p className="text-center text-red-400 py-12 bg-red-400/10 rounded-lg border border-red-400/20">{error}</p>}
            
            {!loading && !error && models.length === 0 && (
              <p className="text-center text-slate-400 py-12">{t('no_firmware')}</p>
            )}

            {!loading && !error && models.length > 0 && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                {/* Step 1: Device */}
                <div className="card-modern p-6 flex flex-col relative">
                  <div className="absolute top-4 left-4 w-8 h-8 rounded-full step-badge-circle flex items-center justify-center font-bold">1</div>
                  
                  <div className="mt-8 text-center flex-1">
                    <RadarIcon className="w-24 h-24 mx-auto text-slate-400 dark:text-slate-600 mb-6 drop-shadow-lg" />
                    <h2 className="text-xl font-bold text-slate-900 dark:text-white mb-2 tracking-wide uppercase">{t('step1_title')}</h2>
                    <p className="text-sm text-slate-600 dark:text-slate-400 mb-6">{t('step1_desc')}</p>
                    
                    <div className="relative text-left mt-auto">
                      <select 
                        className="w-full bg-white dark:bg-bg-dark border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-sm rounded-lg focus:ring-brand focus:border-brand block p-3 appearance-none cursor-pointer hover:border-slate-400 dark:hover:border-slate-500 transition-colors"
                        value={selectedRadar}
                        onChange={(e) => setSelectedRadar(e.target.value)}
                      >
                        <option value="" disabled>{t('step1_placeholder')}</option>
                        {radarModels.map(rm => (
                          <option key={rm} value={rm}>{rm.toUpperCase()}</option>
                        ))}
                      </select>
                      <div className="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
                        <ChevronDownIcon />
                      </div>
                    </div>
                  </div>
                </div>

                {/* Step 2: Firmware Variant */}
                <div className="card-modern p-6 flex flex-col relative z-10">
                  <div className={`absolute top-4 left-4 w-8 h-8 rounded-full flex items-center justify-center font-bold transition-colors duration-300 ${isStep2Enabled ? 'step-badge-circle' : 'step-disabled'}`}>2</div>
                  
                  <div className={`mt-8 text-center flex-1 transition-opacity duration-300 flex flex-col ${isStep2Enabled ? 'opacity-100' : 'opacity-40 pointer-events-none'}`}>
                    <DownloadIcon className="w-24 h-24 mx-auto text-slate-400 dark:text-slate-600 mb-6 drop-shadow-lg" />
                    <h2 className="text-xl font-bold text-slate-900 dark:text-white mb-2 tracking-wide uppercase">{t('step2_title')}</h2>
                    <p className="text-sm text-slate-600 dark:text-slate-400 mb-6">{t('step2_desc')}</p>
                    
                    <div className="relative text-left mt-auto">
                      <select 
                        className="w-full bg-white dark:bg-bg-dark border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-sm rounded-lg focus:ring-brand focus:border-brand block p-3 appearance-none cursor-pointer hover:border-slate-400 dark:hover:border-slate-500 transition-colors"
                        value={selectedVariantId}
                        onChange={(e) => setSelectedVariantId(e.target.value)}
                        disabled={!isStep2Enabled}
                      >
                        {variants.map(v => (
                          <option key={v.id} value={v.id}>{v.chip_family}</option>
                        ))}
                      </select>
                      <div className="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
                        <ChevronDownIcon />
                      </div>
                    </div>
                  </div>
                </div>

                {/* Step 3: Flash */}
                <div className="card-modern p-6 flex flex-col relative">
                  <div className={`absolute top-4 left-4 w-8 h-8 rounded-full flex items-center justify-center font-bold transition-colors duration-300 ${isStep3Enabled ? 'step-badge-circle' : 'step-disabled'}`}>3</div>
                  
                  <div className={`mt-8 flex flex-col flex-1 transition-opacity duration-300 ${isStep3Enabled ? 'opacity-100' : 'opacity-40 pointer-events-none'}`}>
                    <div className="text-center flex-1 flex flex-col">
                      <ZapIcon className="w-24 h-24 mx-auto text-brand mb-6 drop-shadow-[0_0_15px_rgba(11,130,92,0.3)]" />
                      <h2 className="text-xl font-bold text-slate-900 dark:text-white mb-2 tracking-wide uppercase">{t('step3_title')}</h2>
                      <p className="text-sm text-slate-600 dark:text-slate-400 mb-6">{t('step3_desc')}</p>
                      
                      {selectedModel && (
                        <div className="mt-auto pt-2">
                          <esp-web-install-button manifest={selectedModel.manifest}>
                            <button slot="unsupported" disabled className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-500 dark:text-slate-400 py-3 rounded-lg text-sm cursor-not-allowed">
                              {t('unsupported_btn')}
                            </button>
                          </esp-web-install-button>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Selected Model Details (Wiring Guide) */}
            {selectedModel && (
              <div className="mt-8 max-w-4xl mx-auto">
                <WiringGuide model={selectedModel} />
              </div>
            )}
            
          </main>

          <footer className="py-8 text-center text-sm text-slate-600 dark:text-slate-500 border-t border-slate-300 dark:border-slate-800 bg-slate-100 dark:bg-bg-dark mt-auto transition-colors duration-300">
            <p>
              {t('footer_built')} <a href="https://esphome.io" className="text-brand hover:underline">ESPHome</a> ·
              {t('footer_source')} <a href="https://github.com/" className="text-brand hover:underline">GitHub</a> ·
              {t('footer_powered')} <a href="https://esphome.github.io/esp-web-tools/" className="text-brand hover:underline">ESP Web Tools</a>
            </p>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ThemeProvider>
        <LanguageProvider>
          <App />
        </LanguageProvider>
      </ThemeProvider>
    );
  </script>
</body>
</html>

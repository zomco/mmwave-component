<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Millimeter-Wave Radar Firmware Installer</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- ESP Web Tools -->
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#10b981', // emerald-500
            'brand-hover': '#059669',
            surface: '#1e293b', // slate-800
            bg: '#0f172a', // slate-900
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #0f172a; /* slate-900 */
      color: #f8fafc; /* slate-50 */
    }
    
    .card-modern {
      background-color: #1e293b; /* slate-800 */
      border: 1px solid #334155; /* slate-700 */
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      transition: all 0.3s ease;
    }
    
    .card-modern:hover {
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
      border-color: #10b981;
    }
    
    .step-badge-circle {
      background-color: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.5);
    }
    
    .step-disabled {
      background-color: transparent;
      border-color: #475569;
      color: #64748b;
    }

    esp-web-install-button::part(button) {
      background: #10b981; 
      color: #fff; 
      border: none;
      border-radius: 0.5rem; 
      padding: 0.75rem 1.5rem;
      font-size: 1rem; 
      font-weight: 600; 
      cursor: pointer; 
      width: 100%;
      transition: background 0.2s, box-shadow 0.2s;
    }
    esp-web-install-button::part(button):hover { 
      background: #059669; 
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // SVG Icons
    const ZapIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-zap"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
    const ChevronDownIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-chevron-down"><polyline points="6 9 12 15 18 9"/></svg>;
    const CpuIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-cpu"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>;
    const RadarIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-radar"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></svg>;
    const DownloadIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-download"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
    const AlertTriangleIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-alert-triangle"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>;

    // Helpers
    const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    
    // Components
    // Radar physical configurations (in mm)
    const RADAR_CONFIG = {
      ld2410: {
        width: 35, height: 7,
        pins: [
          { name: 'VCC', x: 33.5, y: 0.98, type: 'vcc' },
          { name: 'GND', x: 33.5, y: 2.25, type: 'gnd' },
          { name: 'RX', x: 33.5, y: 3.52, type: 'rx' },
          { name: 'TX', x: 33.5, y: 4.79, type: 'tx' },
          { name: 'OUT', x: 33.5, y: 6.06, type: 'out' }
        ]
      },
      ld2450: {
        width: 44, height: 15,
        pins: [
          { name: 'VCC', x: 1.5, y: 5.25, type: 'vcc' },
          { name: 'RX', x: 1.5, y: 6.75, type: 'rx' },
          { name: 'TX', x: 1.5, y: 8.25, type: 'tx' },
          { name: 'GND', x: 1.5, y: 9.75, type: 'gnd' }
        ]
      },
      ld2420: {
        width: 20, height: 20,
        pins: [
          { name: '3V3', x: 18.5, y: 12.16, type: 'vcc' },
          { name: 'GND', x: 18.5, y: 9.62, type: 'gnd' },
          { name: 'OT1', x: 18.5, y: 7.08, type: 'tx' },
          { name: 'RX', x: 18.5, y: 4.54, type: 'rx' }
        ]
      },
      ld2451: {
        width: 70, height: 35,
        pins: [
          { name: '5V', x: 68.5, y: 11.15, type: 'vcc' },
          { name: 'GND', x: 68.5, y: 13.69, type: 'gnd' },
          { name: 'TX', x: 68.5, y: 18.77, type: 'tx' },
          { name: 'RX', x: 68.5, y: 21.31, type: 'rx' }
        ]
      },
      ld2453: {
        width: 30, height: 7,
        pins: [
          { name: '3V3', x: 28.5, y: 1.6, type: 'vcc' },
          { name: 'GND', x: 28.5, y: 2.87, type: 'gnd' },
          { name: 'TX', x: 28.5, y: 4.14, type: 'tx' },
          { name: 'RX', x: 28.5, y: 5.41, type: 'rx' }
        ]
      },
      ld6002: {
        width: 23, height: 25,
        pins: [
          { name: '3V3', x: 3.22, y: 23.79, type: 'vcc', labelDx: 0, labelDy: -10, anchor: 'middle', fontSize: '8' },
          { name: 'GND', x: 5.76, y: 23.79, type: 'gnd', labelDx: 0, labelDy: -10, anchor: 'middle', fontSize: '8' },
          { name: 'TX0', x: 18.46, y: 23.79, type: 'tx', labelDx: 0, labelDy: -10, anchor: 'middle', fontSize: '8' },
          { name: 'RX0', x: 21.00, y: 23.79, type: 'rx', labelDx: 0, labelDy: -10, anchor: 'middle', fontSize: '8' }
        ]
      },
      ld2411: {
        width: 25, height: 25,
        pins: [
          { name: 'RXD', x: 23.5, y: 12.5, type: 'rx' },
          { name: 'TXD', x: 23.5, y: 15.0, type: 'tx' },
          { name: 'OUT', x: 23.5, y: 17.5, type: 'other' },
          { name: 'GND', x: 23.5, y: 20.0, type: 'gnd' },
          { name: 'VIN', x: 23.5, y: 22.5, type: 'vcc' }
        ]
      },
      rd03e: {
        width: 28, height: 24,
        pins: [
          { name: 'VCC', x: 8.99, y: 21.82, type: 'vcc', labelDx: 0, labelDy: -12, anchor: 'middle', fontSize: '8' },
          { name: 'GND', x: 11.53, y: 21.82, type: 'gnd', labelDx: 0, labelDy: -12, anchor: 'middle', fontSize: '8' },
          { name: 'OT1', x: 14.07, y: 21.82, type: 'tx', labelDx: 0, labelDy: -12, anchor: 'middle', fontSize: '8' },
          { name: 'RX', x: 16.61, y: 21.82, type: 'rx', labelDx: 0, labelDy: -12, anchor: 'middle', fontSize: '8' }
        ]
      },
      r60abd1: {
        width: 35, height: 30,
        pins: [
          { name: '5V', x: 4, y: 12.5, type: 'vcc', labelDx: -10, anchor: 'end' },
          { name: 'GND', x: 6.5, y: 12.5, type: 'gnd', labelDx: 10, anchor: 'start' },
          { name: 'RX', x: 4, y: 15, type: 'rx', labelDx: -10, anchor: 'end' },
          { name: 'TX', x: 6.5, y: 15, type: 'tx', labelDx: 10, anchor: 'start' }
        ]
      }
    };

    const getRadarType = (modelStr) => {
      if (!modelStr) return 'generic';
      const s = modelStr.toLowerCase();
      if (s.includes('ld2410')) return 'ld2410';
      if (s.includes('ld2411')) return 'ld2411';
      if (s.includes('ld2420')) return 'ld2420';
      if (s.includes('ld2450')) return 'ld2450';
      if (s.includes('ld2451')) return 'ld2451';
      if (s.includes('ld2453')) return 'ld2453';
      if (s.includes('ld6002')) return 'ld6002';
      if (s.includes('rd03e')) return 'rd03e';
      if (s.includes('r60abd1')) return 'r60abd1';
      return 'generic';
    };

    const getRadarConfig = (radarType) => {
      if (RADAR_CONFIG[radarType]) return RADAR_CONFIG[radarType];
      // Generic default radar (15x30mm)
      return {
        width: 15, height: 30,
        pins: [
          { name: 'VCC', x: 7.5, y: 22, type: 'vcc' },
          { name: 'GND', x: 7.5, y: 24.54, type: 'gnd' },
          { name: 'TX', x: 7.5, y: 27.08, type: 'tx' },
          { name: 'RX', x: 7.5, y: 29.62, type: 'rx' }
        ]
      };
    };

    const DynamicWiringDiagram = ({ model }) => {
      const scale = 8; // 1mm = 8px
      const espWidth = 18 * scale;
      const espHeight = 22.5 * scale;
      const espX = 50;
      const espY = 50;
      
      // Robustly extract the radar type string from the varied JSON fields
      const typeStr = (model.radar_model || model.name || model.id || '').toLowerCase();
      const radarType = getRadarType(typeStr);
      const radarConfig = getRadarConfig(radarType);
      
      const radarWidth = radarConfig.width * scale;
      const radarHeight = radarConfig.height * scale;
      const radarX = 400;
      const radarY = 50;

      // ESP32-C3 Supermini Pin mappings (front view: 5V is Top-Right, 21 is Bottom-Left)
      const espPins = {
        '5V': { x: espWidth, y: 20, color: '#ef4444', labelX: espWidth - 25 },
        'GND': { x: espWidth, y: 40, color: '#22c55e', labelX: espWidth - 25 },
        '3V3': { x: espWidth, y: 60, color: '#b91c1c', labelX: espWidth - 25 },
        'RX': { x: 0, y: 140, color: '#06b6d4', labelX: 30, label: '20(RX)' },
        'TX': { x: 0, y: 160, color: '#f59e0b', labelX: 30, label: '21(TX)' }
      };

      // Generate wires
      const wires = [];
      const radarPinsRender = radarConfig.pins.map((pin, i) => {
        const absX = radarX + pin.x * scale;
        const absY = radarY + pin.y * scale;
        
        let targetEspPin = null;
        if (pin.type === 'vcc') targetEspPin = espPins['5V'];
        if (pin.type === 'gnd') targetEspPin = espPins['GND'];
        if (pin.type === 'rx') targetEspPin = espPins['TX']; // Radar RX connects to ESP TX
        if (pin.type === 'tx') targetEspPin = espPins['RX']; // Radar TX connects to ESP RX

        if (targetEspPin) {
          const startX = espX + targetEspPin.x;
          const startY = espY + targetEspPin.y;
          
          const isEspLeft = targetEspPin.x === 0;
          const isRadarLeft = (pin.x * scale) < (radarWidth / 2);
          
          const espDropX = startX + (isEspLeft ? -20 - i*6 : 20 + i*6);
          const radarDropX = absX + (isRadarLeft ? -20 - i*6 : 20 + i*6);
          const busY = Math.max(espY + espHeight, radarY + radarHeight) + 20 + (i * 8);

          const points = [
            `${startX},${startY}`,
            `${espDropX},${startY}`,
            `${espDropX},${busY}`,
            `${radarDropX},${busY}`,
            `${radarDropX},${absY}`,
            `${absX},${absY}`
          ];

          wires.push(
            <polyline 
              key={`wire-${i}`} 
              points={points.join(' ')} 
              fill="none" 
              stroke={targetEspPin.color} 
              strokeWidth="2.5" 
              strokeLinejoin="round"
              opacity="0.8" 
            />
          );
        }

        const isRadarLeft = (pin.x * scale) < (radarWidth / 2);
        return (
          <g key={`rpin-${i}`}>
            {targetEspPin && (
              <circle cx={absX} cy={absY} r="7" fill="none" stroke={targetEspPin.color} strokeWidth="2.5" opacity="0.8" />
            )}
            <circle cx={absX} cy={absY} r="4" fill={targetEspPin ? targetEspPin.color : "#fbbf24"} />
            <text 
              x={absX + (pin.labelDx !== undefined ? pin.labelDx : (isRadarLeft ? 10 : -8))} 
              y={absY + (pin.labelDy !== undefined ? pin.labelDy : 3)} 
              textAnchor={pin.anchor || (isRadarLeft ? "start" : "end")} 
              fill={targetEspPin ? targetEspPin.color : "#94a3b8"} 
              fontSize={pin.fontSize || "10"} 
              fontWeight="bold"
            >
              {pin.name}
            </text>
          </g>
        );
      });

      // Calculate required width and height for SVG viewBox
      const maxBoardY = Math.max(espY + espHeight, radarY + radarHeight);
      const svgHeight = Math.max(300, maxBoardY + 100); 
      const svgWidth = radarX + radarWidth + 50;

      return (
        <svg viewBox={`0 0 ${svgWidth} ${svgHeight}`} className="w-full bg-slate-900 rounded-lg border border-slate-700" style={{fontFamily: "system-ui, sans-serif"}}>
          <defs>
            <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" strokeWidth="0.5" opacity="0.3" />
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#grid)" />

          {/* ESP32-C3 Supermini Board (Front View) */}
          <g transform={`translate(${espX}, ${espY})`}>
            {/* Board Base (Black) */}
            <rect x="0" y="0" width={espWidth} height={espHeight} rx="6" fill="#111827" stroke="#374151" strokeWidth="2" />
            
            {/* Ceramic Antenna (Pink/Red at bottom) */}
            <rect x={espWidth/2 - 20} y={espHeight - 20} width="40" height="15" fill="#fca5a5" stroke="#ef4444" strokeWidth="1" />
            
            {/* QFN32 Chip (Rotated 45 degrees) */}
            <g transform={`translate(${espWidth/2}, ${espHeight/2 + 25}) rotate(45)`}>
              <rect x="-16" y="-16" width="32" height="32" rx="1" fill="#1f2937" stroke="#4b5563" strokeWidth="1" />
              {/* Chip Pins (tiny) */}
              {[...Array(8)].map((_, i) => (
                <g key={i}>
                  <line x1="-16" y1={-10 + i*3} x2="-18" y2={-10 + i*3} stroke="#9ca3af" strokeWidth="1" />
                  <line x1="16" y1={-10 + i*3} x2="18" y2={-10 + i*3} stroke="#9ca3af" strokeWidth="1" />
                  <line x1={-10 + i*3} y1="-16" x2={-10 + i*3} y2="-18" stroke="#9ca3af" strokeWidth="1" />
                  <line x1={-10 + i*3} y1="16" x2={-10 + i*3} y2="18" stroke="#9ca3af" strokeWidth="1" />
                </g>
              ))}
            </g>
            
            {/* Two White Buttons (BOOT & RST) */}
            <rect x={espWidth/2 - 25} y="45" width="20" height="20" rx="2" fill="#f3f4f6" />
            <circle cx={espWidth/2 - 15} cy="55" r="4" fill="#9ca3af" />
            
            <rect x={espWidth/2 + 5} y="45" width="20" height="20" rx="2" fill="#f3f4f6" />
            <circle cx={espWidth/2 + 15} cy="55" r="4" fill="#9ca3af" />

            {/* USB-C Port (Top Center) */}
            <rect x={espWidth/2 - 20} y="-5" width="40" height="25" rx="3" fill="#e5e7eb" stroke="#d1d5db" strokeWidth="1" />
            <rect x={espWidth/2 - 14} y="-5" width="28" height="6" rx="2" fill="#111827" />

            {/* Pins */}
            {Object.entries(espPins).map(([name, pos]) => (
              <g key={name}>
                {/* Gold Pad Highlight */}
                <rect x={pos.x === 0 ? -2 : espWidth - 14} y={pos.y - 8} width="16" height="16" rx="6" fill="none" stroke={pos.color} strokeWidth="2.5" opacity="0.8" />
                {/* Gold Pad */}
                <rect x={pos.x === 0 ? 0 : espWidth - 12} y={pos.y - 6} width="12" height="12" rx="4" fill="#fbbf24" />
                {/* Pin Hole */}
                <circle cx={pos.x === 0 ? 6 : espWidth - 6} cy={pos.y} r="3.5" fill={pos.color} />
                <text x={pos.labelX} y={pos.y + 3} textAnchor="middle" fill={pos.color} fontSize="9" fontWeight="bold">
                  {pos.label || name}
                </text>
              </g>
            ))}
            
            {/* Unused Pins (Left) */}
            {[20, 40, 60, 80, 100, 120].map(y => (
              <g key={`l-${y}`}>
                <rect x="0" y={y - 6} width="12" height="12" rx="4" fill="#fbbf24" />
                <circle cx="6" cy={y} r="3.5" fill="#111827" />
              </g>
            ))}
            {/* Unused Pins (Right) */}
            {[80, 100, 120, 140, 160].map(y => (
              <g key={`r-${y}`}>
                <rect x={espWidth - 12} y={y - 6} width="12" height="12" rx="4" fill="#fbbf24" />
                <circle cx={espWidth - 6} cy={y} r="3.5" fill="#111827" />
              </g>
            ))}
          </g>

          {/* Radar Board */}
          <g transform={`translate(${radarX}, ${radarY})`}>
            {/* Board Base */}
            <rect x="0" y="0" width={radarWidth} height={radarHeight} rx="4" fill={radarType === 'r60abd1' ? "#166534" : "#1e3a8a"} stroke={radarType === 'r60abd1' ? "#14532d" : "#1e40af"} strokeWidth="2" />
            
            {/* Radar Components */}
            {radarType === 'ld2410' ? (
              <g>
                {/* Clearance areas (lighter blue/gold outline effect) */}
                <path d="M 24 16 L 46 16 L 53 10 L 73 10 L 82 22 L 95 22" fill="none" stroke="#0ea5e9" strokeWidth="8" opacity="0.3" />
                <path d="M 125 22 L 138 22 L 147 34 L 187 34 L 196 16 L 216 16" fill="none" stroke="#0ea5e9" strokeWidth="8" opacity="0.3" />
                <rect x="18" y="20" width="34" height="30" rx="4" fill="none" stroke="#0ea5e9" strokeWidth="6" opacity="0.3" />
                <rect x="208" y="20" width="34" height="30" rx="4" fill="none" stroke="#0ea5e9" strokeWidth="6" opacity="0.3" />

                {/* Left Gold Pad */}
                <rect x="22" y="24" width="26" height="22" rx="1" fill="#eab308" />
                {/* Left Trace */}
                <path d="M 40 24 Q 44 16, 50 16 L 70 16 Q 76 16, 79 22 L 85 28 L 92 28" fill="none" stroke="#eab308" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                
                {/* Right Gold Pad */}
                <rect x="212" y="24" width="26" height="22" rx="1" fill="#eab308" />
                {/* Right Trace */}
                <path d="M 128 28 L 135 28 Q 140 28, 144 32 L 148 36 Q 152 40, 158 40 L 185 40 Q 192 40, 195 34 L 200 24 Q 203 16, 210 16 L 220 16 Q 225 16, 225 24" fill="none" stroke="#eab308" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                
                {/* Main Chip */}
                <rect x="92" y="14" width="36" height="36" rx="2" fill="#1e293b" />
                {/* Chip Pins (Sides only) */}
                {[...Array(8)].map((_, i) => (
                  <g key={i}>
                    <line x1="90" y1={18 + i*3.5} x2="92" y2={18 + i*3.5} stroke="#9ca3af" strokeWidth="1" />
                    <line x1="128" y1={18 + i*3.5} x2="130" y2={18 + i*3.5} stroke="#9ca3af" strokeWidth="1" />
                  </g>
                ))}
                
                {/* Chip Silkscreen */}
                <text x="110" y="26" textAnchor="middle" fill="#64748b" fontSize="5" transform="rotate(-90, 110, 26)">S3KM111L</text>
                <text x="117" y="32" textAnchor="middle" fill="#64748b" fontSize="4" transform="rotate(-90, 117, 32)">N47K93D1</text>
                {/* Running person logo mock */}
                <path d="M 118 40 L 115 42 L 115 45 M 115 42 L 112 40 M 115 39 A 1 1 0 1 1 116 38" fill="none" stroke="#94a3b8" strokeWidth="0.8" transform="rotate(-90, 115, 41)" />

                {/* WiGig Text */}
                <text x="35" y="52" fill="#f8fafc" fontSize="8" fontWeight="900" fontFamily="sans-serif">WiGig</text>
                <circle cx="56" cy="46" r="1.5" fill="#f8fafc" />
                
                {/* Small passive components */}
                {/* Top right caps */}
                <rect x="150" y="4" width="6" height="8" rx="1" fill="#f1f5f9" stroke="#94a3b8" strokeWidth="0.5" />

                {/* Bottom Antenna Substrate */}
                <rect x="24" y="130" width="136" height="50" rx="2" fill="#fde68a" />
                
                {/* Bottom Feed Line */}
                <rect x="40" y="138" width="100" height="4" fill="#fbbf24" />
                <rect x="88" y="112" width="4" height="26" fill="#fbbf24" />

                {/* Bottom Squares & Traces */}
                {[30, 62, 94, 126].map((x, i) => (
                  <g key={`b-ant-${i}`}>
                    <rect x={x} y="156" width="20" height="20" fill="#fbbf24" />
                    <path d={`M ${x} 166 L ${x-8} 166 L ${x-8} 150 L ${x+4} 150 L ${x+4} 142`} fill="none" stroke="#fbbf24" strokeWidth="2" />
                    <rect x={x-4} y="148" width="10" height="4" fill="#fbbf24" />
                  </g>
                ))}

                {/* Chip Pins */}
                <rect x="70" y="88" width="40" height="24" fill="#94a3b8" opacity="0.5" />
                <rect x="78" y="80" width="24" height="40" fill="#94a3b8" opacity="0.5" />
                
                {/* Main Chip */}
                <rect x="74" y="84" width="32" height="32" rx="1" fill="#1e293b" />
                <path d="M 82 96 Q 90 90 98 96 T 106 96" fill="none" stroke="#64748b" strokeWidth="1" />
                <text x="90" y="106" fill="#64748b" fontSize="4">3KM111</text>

                {/* WiGig Logo */}
                <g transform="rotate(-90, 124, 108)">
                  <text x="124" y="108" fill="#cbd5e1" fontSize="10" fontWeight="bold">WiGig</text>
                  <text x="156" y="104" fill="#cbd5e1" fontSize="5">®</text>
                </g>

                {/* Left Components */}
                <rect x="14" y="86" width="12" height="28" fill="none" stroke="#cbd5e1" strokeWidth="1" />
                <rect x="28" y="86" width="14" height="28" fill="none" stroke="#cbd5e1" strokeWidth="1" />
                <rect x="22" y="90" width="12" height="20" fill="#e2e8f0" />
                <circle cx="28" cy="100" r="4" fill="#fbbf24" />

                {/* Decorative Vias */}
                {[20, 40, 60, 80, 100, 120, 140, 160, 180].map(y => (
                  <circle key={`via1-${y}`} cx="8" cy={y} r="1.5" fill="#1e3a8a" stroke="#1d4ed8" />
                ))}
                {[20, 40, 60, 80, 100, 120, 140, 160, 180].map(y => (
                  <circle key={`via2-${y}`} cx="192" cy={y} r="1.5" fill="#1e3a8a" stroke="#1d4ed8" />
                ))}
              </g>
            ) : (
              <g>
                <rect x="2" y="2" width={radarWidth < radarHeight ? radarWidth - 4 : 20} height={radarWidth < radarHeight ? radarWidth - 4 : radarHeight - 4} rx="2" fill="#022c22" opacity="0.6" />
                <rect x={radarWidth/2 - 15} y={radarHeight/2 - 15} width="30" height="30" rx="2" fill="#1e293b" />
                <text x={radarWidth/2} y={radarHeight/2 + 4} textAnchor="middle" fill="#34d399" fontSize="12" fontWeight="bold" transform={radarWidth < radarHeight ? `rotate(-90, ${radarWidth/2}, ${radarHeight/2})` : ''}>
                  {model.name}
                </text>
              </g>
            )}
          </g>
          
          {/* Wires (Rendered above boards) */}
          {wires}

          {/* Radar Pins */}
          {radarPinsRender}

        </svg>
      );
    }

    const WiringGuide = ({ model }) => {
      return (
        <div className="mt-8 border-t border-slate-700 pt-8 space-y-6">
          <div>
            <h4 className="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4 flex items-center justify-center gap-2">
              <CpuIcon />
              Wiring Diagram: ESP32-C3 Supermini ↔ {model.name}
            </h4>
            <DynamicWiringDiagram model={model} />
            <p className="text-xs text-slate-500 mt-3 text-center">
              * Diagram generated dynamically based on physical dimensions. GPIO assignments can be changed in <code className="text-slate-400">tests/{model.radar_model}.yaml</code>.
            </p>
          </div>
        </div>
      );
    }


    const App = () => {
      const [models, setModels] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [isWebSerialSupported, setIsWebSerialSupported] = useState(true);

      const [selectedRadar, setSelectedRadar] = useState("");
      const [selectedVariantId, setSelectedVariantId] = useState("");

      useEffect(() => {
        setIsWebSerialSupported('serial' in navigator);
        
        fetch('models.json')
          .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
          })
          .then(data => {
            setModels(data);
            setLoading(false);
          })
          .catch(err => {
            console.error(err);
            setError('Failed to load firmware list. Please refresh or check the repository.');
            setLoading(false);
          });
      }, []);

      // Group models by radar_model
      const radarModels = useMemo(() => {
        const unique = [...new Set(models.map(m => m.radar_model))];
        return unique.sort();
      }, [models]);

      // Get variants for selected radar
      const variants = useMemo(() => {
        if (!selectedRadar) return [];
        return models.filter(m => m.radar_model === selectedRadar);
      }, [models, selectedRadar]);

      const selectedModel = useMemo(() => {
        if (!selectedVariantId) return null;
        return models.find(m => m.id === selectedVariantId);
      }, [models, selectedVariantId]);

      // Reset variant when radar changes
      useEffect(() => {
        if (variants.length > 0) {
          setSelectedVariantId(variants[0].id);
        } else {
          setSelectedVariantId("");
        }
      }, [selectedRadar, variants]);

      const isStep2Enabled = !!selectedRadar;
      const isStep3Enabled = !!selectedVariantId;

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {!isWebSerialSupported && (
            <div className="bg-amber-500 text-slate-900 text-center p-3 font-medium flex items-center justify-center gap-2">
              <AlertTriangleIcon />
              Requires a Chromium-based browser (Chrome or Edge) with Web Serial support.
            </div>
          )}

          <header className="py-8 text-center bg-slate-900 border-b border-slate-800">
            <h1 className="text-3xl md:text-4xl font-bold text-white mb-3 flex items-center justify-center gap-3">
              <RadarIcon className="text-brand w-8 h-8 md:w-10 md:h-10" />
              Millimeter-Wave Radar Firmware
            </h1>
            <p className="text-slate-400 max-w-2xl mx-auto px-4 text-sm md:text-base">
              Flash your radar sensor directly from the browser using ESP Web Tools. No software installation required.
            </p>
          </header>

          <main className="flex-1 max-w-6xl w-full mx-auto p-4 md:p-8">
            {loading && <p className="text-center text-slate-400 animate-pulse py-12">Loading available firmware…</p>}
            {error && <p className="text-center text-red-400 py-12 bg-red-400/10 rounded-lg border border-red-400/20">{error}</p>}
            
            {!loading && !error && models.length === 0 && (
              <p className="text-center text-slate-400 py-12">No firmware builds available yet.</p>
            )}

            {!loading && !error && models.length > 0 && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                {/* Step 1: Device */}
                <div className="card-modern p-6 flex flex-col relative">
                  <div className="absolute top-4 left-4 w-8 h-8 rounded-full step-badge-circle flex items-center justify-center font-bold">1</div>
                  
                  <div className="mt-8 text-center flex-1">
                    <RadarIcon className="w-24 h-24 mx-auto text-slate-600 mb-6 drop-shadow-lg" />
                    <h2 className="text-xl font-bold text-white mb-2 tracking-wide uppercase">Select Device</h2>
                    <p className="text-sm text-slate-400 mb-6">Choose your mmWave radar sensor model.</p>
                    
                    <div className="relative text-left mt-auto">
                      <select 
                        className="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-brand focus:border-brand block p-3 appearance-none cursor-pointer hover:border-slate-500 transition-colors"
                        value={selectedRadar}
                        onChange={(e) => setSelectedRadar(e.target.value)}
                      >
                        <option value="" disabled>Select a radar model...</option>
                        {radarModels.map(rm => (
                          <option key={rm} value={rm}>{rm.toUpperCase()}</option>
                        ))}
                      </select>
                      <div className="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
                        <ChevronDownIcon />
                      </div>
                    </div>
                  </div>
                </div>

                {/* Step 2: Firmware Variant */}
                <div className="card-modern p-6 flex flex-col relative z-10">
                  <div className={`absolute top-4 left-4 w-8 h-8 rounded-full flex items-center justify-center font-bold transition-colors duration-300 ${isStep2Enabled ? 'step-badge-circle' : 'step-disabled'}`}>2</div>
                  
                  <div className={`mt-8 text-center flex-1 transition-opacity duration-300 flex flex-col ${isStep2Enabled ? 'opacity-100' : 'opacity-40 pointer-events-none'}`}>
                    <DownloadIcon className="w-24 h-24 mx-auto text-slate-600 mb-6 drop-shadow-lg" />
                    <h2 className="text-xl font-bold text-white mb-2 tracking-wide uppercase">Select Variant</h2>
                    <p className="text-sm text-slate-400 mb-6">Choose the target microcontroller variant.</p>
                    
                    <div className="relative text-left mt-auto">
                      <select 
                        className="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-brand focus:border-brand block p-3 appearance-none cursor-pointer hover:border-slate-500 transition-colors"
                        value={selectedVariantId}
                        onChange={(e) => setSelectedVariantId(e.target.value)}
                        disabled={!isStep2Enabled}
                      >
                        {variants.map(v => (
                          <option key={v.id} value={v.id}>{v.chip_family}</option>
                        ))}
                      </select>
                      <div className="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
                        <ChevronDownIcon />
                      </div>
                    </div>
                  </div>
                </div>

                {/* Step 3: Flash */}
                <div className="card-modern p-6 flex flex-col relative">
                  <div className={`absolute top-4 left-4 w-8 h-8 rounded-full flex items-center justify-center font-bold transition-colors duration-300 ${isStep3Enabled ? 'step-badge-circle' : 'step-disabled'}`}>3</div>
                  
                  <div className={`mt-8 flex flex-col flex-1 transition-opacity duration-300 ${isStep3Enabled ? 'opacity-100' : 'opacity-40 pointer-events-none'}`}>
                    <div className="text-center flex-1 flex flex-col">
                      <ZapIcon className="w-24 h-24 mx-auto text-brand mb-6 drop-shadow-[0_0_15px_rgba(16,185,129,0.3)]" />
                      <h2 className="text-xl font-bold text-white mb-2 tracking-wide uppercase">Flash</h2>
                      <p className="text-sm text-slate-400 mb-6">Connect your device via USB and flash.</p>
                      
                      {selectedModel && (
                        <div className="mt-auto pt-2">
                          <esp-web-install-button manifest={selectedModel.manifest}>
                            <button slot="unsupported" disabled className="w-full bg-slate-800 border border-slate-700 text-slate-400 py-3 rounded-lg text-sm cursor-not-allowed">
                              ⚠️ Web Serial not supported
                            </button>
                          </esp-web-install-button>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Selected Model Details (Wiring Guide) */}
            {selectedModel && (
              <div className="mt-8 max-w-4xl mx-auto">
                <WiringGuide model={selectedModel} />
              </div>
            )}
            
          </main>

          <footer className="py-8 text-center text-sm text-slate-500 border-t border-slate-800 bg-slate-900 mt-auto">
            <p>
              Firmware built with <a href="https://esphome.io" className="text-brand hover:underline">ESPHome</a> ·
              Source on <a href="https://github.com/" className="text-brand hover:underline">GitHub</a> ·
              Flashing powered by <a href="https://esphome.github.io/esp-web-tools/" className="text-brand hover:underline">ESP Web Tools</a>
            </p>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

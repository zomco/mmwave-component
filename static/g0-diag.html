<!doctype html>
<meta charset="utf-8" />
<title>MWCP G0 diagnostic</title>
<body>
<p id="state">idle</p>
<button id="connect" type="button">Connect</button>
<button id="close" type="button">Disconnect</button>
<button id="capture" type="button">Start capture</button>
<button id="stop" type="button">Stop capture</button>
<button id="export" type="button">Export</button>
<p id="hint">Start capture, stop, then export. Segments keep the time range. A hung close stays error until Disconnect is retried. This page does not prove a two-hour hardware run.</p>
<pre id="log"></pre>
<pre id="export-out"></pre>
<script type="module">
import { bindDiagPage } from './src/g0/diag-page.js';
const nonce = crypto.randomUUID().replace(/-/g, '').slice(0, 32);
bindDiagPage(document, navigator.serial, {
  client: { name: 'mmwave-web-console', version: '0.1.0' },
  nonce,
});
</script>
</body>

name: Publish GitHub Pages
on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'scripts/releases.py'
      - 'protocol/**'
      - 'components/r60abd1/**'
      - 'docs/reviews/web-console/g0/**'
      - '.github/workflows/publish-pages.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: static/package-lock.json
      - name: Test release tooling
        run: python3 -m unittest discover -s tests -p test_releases.py -v
      - name: Install C++ compiler for firmware contract tests
        run: sudo apt-get update && sudo apt-get install -y g++
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
      - name: Build installer
        working-directory: static
        env:
          MWCP_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          # MWCP_GPP supports an executable path or a command name resolved via PATH
          MWCP_GPP: g++
        run: |
          npm ci
          npm run test:unit
          npm run test:browser
          npm run build
      - name: Assemble version history from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/releases.py assemble "$REPOSITORY" static/dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: static/dist
      - uses: actions/deploy-pages@v5
        id: deploy

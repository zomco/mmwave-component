name: Publish GitHub Pages
on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'scripts/releases.py'
      - '.github/workflows/publish-pages.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: static/package-lock.json
      - name: Test release tooling
        run: python3 -m unittest discover -s tests -p test_releases.py -v
      - name: Build installer
        working-directory: static
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble version history and preserve existing OTA URLs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repo_name="${REPOSITORY#*/}"
          python3 scripts/releases.py assemble "$REPOSITORY" static/dist "https://${OWNER}.github.io/${repo_name}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: static/dist
      - uses: actions/deploy-pages@v5
        id: deploy

name: Web installer checks
on:
  pull_request:
    paths: ['static/**', 'scripts/**', 'patches/**', 'tests/test_releases.py', 'protocol/**', 'components/mmwave_host/**', 'components/r60abd1/**', 'docs/reviews/web-console/g0/**', '.github/workflows/**', 'README.md']
  push:
    branches: [main]
    paths: ['static/**', 'scripts/**', 'patches/**', 'tests/test_releases.py', 'protocol/**', 'components/mmwave_host/**', 'components/r60abd1/**', 'docs/reviews/web-console/g0/**', '.github/workflows/**', 'README.md']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: static/package-lock.json
      - run: python3 scripts/releases.py catalog
      - run: python3 -m unittest discover -s tests -p test_releases.py -v
      - name: Install C++ compiler for firmware contract tests
        run: sudo apt-get update && sudo apt-get install -y g++
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
      - working-directory: static
        env:
          MWCP_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          # Local fixture browser only; retry only a diagnosed Linux sandbox error.
          MWCP_CI_SANDBOX_FALLBACK: '1'
          # MWCP_GPP supports an executable path or a command name resolved via PATH
          MWCP_GPP: g++
        run: |
          npm ci
          npm run test:unit
          npm run test:browser
          npm run build

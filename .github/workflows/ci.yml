name: CI

# Validates that every firmware configuration in tests/ compiles on every PR.
#
# docs/ is the datasheet tree (~186MB), not a firmware build input.
# tests/*.py and tests/*.cpp are not executed by this workflow;
# ignoring them is the same trade-off as the workspace cases/ filter. If a job
# starts running those tests, drop them from paths-ignore.
on:
  push:
    branches:
      - main
    paths-ignore: &firmware-ignore
      - 'docs/**'
      - 'assets/**'
      - 'blueprints/**'
      - '.agents/**'
      - '.vscode/**'
      - 'README.md'
      - 'README_CN.md'
      - 'DIY.md'
      - 'DIY_CN.md'
      - 'GETTING-STARTED.md'
      - 'GETTING-STARTED_CN.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      - 'tests/*.py'
      - 'tests/*.cpp'
      - 'tests/*.h'
  pull_request:
    branches:
      - main
    paths-ignore: *firmware-ignore

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Formatting ──────────────────────────────────────────────────────────────
  # Runs before the builds and is the cheapest job here, so a pull request that
  # is only mis-formatted says so in seconds rather than after sixteen firmware
  # compiles.
  #
  # The style is ESPHome's own, copied verbatim into .clang-format. These
  # components are read alongside ESPHome's and compiled by its toolchain, so
  # matching upstream is worth more than any local preference.
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than floating: a new clang-format release changes its mind
      # about some wrapping every so often, and a formatting job that fails
      # because the runner image moved teaches people to ignore it.
      - name: Install clang-format
        run: pip install "clang-format==22.1.8"

      - name: Check formatting
        run: |
          files=$(find components -name '*.cpp' -o -name '*.h')
          if ! clang-format --style=file --dry-run -Werror $files; then
            echo "::error::Run: clang-format --style=file -i \$(find components -name '*.cpp' -o -name '*.h')"
            exit 1
          fi

  r60-usb:
    name: Check R60 USB ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject a candidate that shares USB with serial Improv
        run: python scripts/check_r60_usb_profile.py

  # ── Pinned ESPHome patch ────────────────────────────────────────────────────
  # The host-enabled firmware runs on a stock ESPHome release plus exactly one
  # reviewed patch (patches/esphome-2026.9.1-wifi-scan-ownership.patch). This
  # job proves the patch still applies byte-exactly to the pinned release, so a
  # release re-pin or an upstream change cannot silently strand the wifi.scan
  # ownership guarantees.
  patch:
    name: Verify pinned ESPHome patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned ESPHome
        run: pip install "esphome==2026.9.1"

      - name: Verify patch applies to pristine sources
        run: |
          python scripts/apply_esphome_patch.py \
            --esphome-package "$(python -c 'import esphome, os; print(os.path.dirname(esphome.__file__))')" \
            --check

  # The hash check above is necessary but not sufficient: a patch can apply and
  # still fail to compile, or define the listener API without the component
  # picking it up. This job applies the patch and compiles the offline host
  # profile, then verifies the generated defines. The stock fallback is covered
  # by the build matrix below.
  patch-build:
    name: Build host profile with pinned patch
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned ESPHome
        run: pip install "esphome==2026.9.1"

      - name: Cache ESPHome build dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/esphome
            ~/.esphome
            ~/.platformio
            .esphome-host
          key: ${{ runner.os }}-esphome-2026.9.1-${{ hashFiles('tests/r60abd1-esp32c3-host.yaml', 'tests/common/r60abd1_mwcp.yaml', 'patches/*.patch', 'components/mmwave_host/**') }}

      - name: Build patched host firmware
        run: python scripts/build_host_profile.py --mode patched

      # Compiling proves the patch is loadable, not that every scan entry uses
      # the coordinator. This audit fails if a scan start or completion dispatch
      # is added outside the single ownership choke point.
      - name: Audit scan ownership call sites
        run: |
          python scripts/check_scan_ownership_sources.py \
            --esphome-package "$(python -c 'import esphome, os; print(os.path.dirname(esphome.__file__))')"

  discover:
    name: Discover test configurations
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.list.outputs.configs }}
    steps:
      - uses: actions/checkout@v7
      - name: List test YAML files
        id: list
        # -maxdepth 1 on purpose. Firmware configs live directly in tests/;
        # tests/common/ holds packages — radar cores and the shared device
        # package — which carry no board, no networking and no esphome: name,
        # and cannot build on their own. Recursing into it queued one doomed
        # job per package and is why this workflow had never been green.
        run: |
          configs=$(find tests -maxdepth 1 -name "*.yaml" | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "configs=$configs" >> "$GITHUB_OUTPUT"
          echo "Found: $configs"

  build:
    name: Build ${{ matrix.config }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.discover.outputs.configs) }}
    steps:
      - uses: actions/checkout@v7
      - name: Build ESPHome firmware
        uses: esphome/build-action@v7
        with:
          yaml-file: ${{ matrix.config }}
          version: "2026.9.1"
